<script>
(function(){
  /* Häkchen "Sitzt": im Browser speichern und in der Navigation spiegeln */
  try{
    var boxen=document.querySelectorAll('input[type=checkbox][data-key]');
    Array.prototype.forEach.call(boxen,function(b){
      var key='ap1.sitzt.'+b.getAttribute('data-key');
      try{ b.checked=(localStorage.getItem(key)==='1'); }catch(e){}
      spiegeln(b);
      b.addEventListener('change',function(){
        try{ localStorage.setItem(key,b.checked?'1':'0'); }catch(e){}
        spiegeln(b);
      });
    });
    function spiegeln(b){
      var li=document.querySelector('nav.inhalt li[data-kap="'+b.getAttribute('data-key')+'"]');
      if(li){ if(b.checked){ li.classList.add('sitzt'); } else { li.classList.remove('sitzt'); } }
    }
  }catch(e){}

  /* Druck: alle Lösungen aufklappen, danach Zustand wiederherstellen */
  try{
    var geoeffnet=[];
    window.addEventListener('beforeprint',function(){
      geoeffnet=[];
      Array.prototype.forEach.call(document.querySelectorAll('details'),function(d){
        if(!d.open){ d.open=true; geoeffnet.push(d); }
      });
    });
    window.addEventListener('afterprint',function(){
      geoeffnet.forEach(function(d){ d.open=false; });
      geoeffnet=[];
    });
  }catch(e){}

  /* Aktuelles Kapitel in der Navigation markieren */
  try{
    if('IntersectionObserver' in window){
      var links={};
      Array.prototype.forEach.call(document.querySelectorAll('nav.inhalt a[href^="#"]'),function(a){
        links[a.getAttribute('href').slice(1)]=a;
      });
      var io=new IntersectionObserver(function(eintraege){
        eintraege.forEach(function(e){
          if(e.isIntersecting){
            Array.prototype.forEach.call(document.querySelectorAll('nav.inhalt a.aktuell'),function(a){ a.classList.remove('aktuell'); });
            var a=links[e.target.id];
            if(a){ a.classList.add('aktuell'); }
          }
        });
      },{rootMargin:'-8% 0px -82% 0px'});
      Array.prototype.forEach.call(document.querySelectorAll('main section[id]'),function(s){
        if(links[s.id]){ io.observe(s); }
      });
    }
  }catch(e){}
})();
</script>
</body>
</html>
