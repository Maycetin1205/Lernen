<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
/* STIL B · Werkstatt, Fassung 2026-09-07: breiter Rahmen, Karten statt schwarzer Balken, ruhige Linien, ein warmer Akzent. */
:root{
  --papier:#ffffff; --grund:#FAFAF9; --flaeche:#F5F4F2;
  --tinte:#0D0F14; --grau:#5A5F6B; --linie:#E3E2DF; --linie-stark:#0D0F14;
  --akzent:#C4400C; --akzent-hell:#FDF0E8; --akzent-tief:#8F2E08;
  --nav-b:18.5rem; --inhalt-b:78rem; --text-b:74ch; --radius:12px;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Inter",Roboto,Arial,sans-serif;
  --anz:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Inter",Roboto,Arial,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",monospace;
}
*{box-sizing:border-box}
html{background:var(--papier);color:var(--tinte);font:17.5px/1.62 var(--sans);-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:2rem;-webkit-font-smoothing:antialiased}
body{margin:0;display:grid;grid-template-columns:var(--nav-b) minmax(0,1fr)}

nav.inhalt{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;min-width:0;background:var(--grund);border-right:1px solid var(--linie);padding:1.75rem 1.1rem 4rem;font-size:.8438rem;line-height:1.35}
nav.inhalt .nav-titel{margin:0 .6rem 1.75rem;font:780 1.125rem/1.15 var(--anz);letter-spacing:-.03em;text-transform:uppercase}
nav.inhalt .nav-titel a{color:var(--tinte);text-decoration:none}
nav.inhalt .nav-gruppe{margin:1.75rem .6rem .5rem;font-size:.6875rem;font-weight:780;letter-spacing:.12em;text-transform:uppercase;color:var(--grau)}
nav.inhalt ol{list-style:none;margin:0;padding:0}
nav.inhalt li a{display:flex;gap:.5rem;padding:.4rem .6rem;border-radius:8px;color:var(--grau);text-decoration:none;font-weight:500}
nav.inhalt li a:hover{color:var(--tinte);background:var(--flaeche)}
nav.inhalt li a.aktuell{color:var(--tinte);font-weight:750;background:var(--akzent-hell)}
nav.inhalt .nr{flex:0 0 2.2em;font-weight:780;color:#B9BCC4;font-variant-numeric:tabular-nums}
nav.inhalt li a:hover .nr,nav.inhalt li a.aktuell .nr{color:var(--akzent)}
nav.inhalt ol.nav-schnell{margin:0 0 1.6rem;padding-bottom:1.2rem;border-bottom:1px solid var(--linie)}
nav.inhalt ol.nav-schnell li a{font-weight:750;color:var(--tinte)}
nav.inhalt ol.nav-schnell li a:hover{color:var(--akzent)}

/* min-width:0 ist der Kern: ohne das wächst main auf die Breite seines breitesten
   Inhalts (der Matrix-Tabelle) und schiebt die ganze Seite über den Bildschirm. */
main{min-width:0;max-width:min(var(--inhalt-b),100%);padding:3.5rem clamp(1.5rem,4vw,4.5rem) 10rem;margin:0 auto}
main p,main ul:not(.glossar),main ol,main .unter{max-width:min(var(--text-b),100%)}
header.titel{padding-bottom:2.5rem;border-bottom:1px solid var(--linie);margin-bottom:1rem}
header.titel+.teil{margin-top:2.5rem;border-top:0;padding-top:1rem}
h1{font:800 clamp(2.2rem,3.4vw,3rem)/1.04 var(--anz);letter-spacing:-.04em;margin:0 0 1.1rem;text-wrap:balance}
h2{font:780 2.35rem/1.08 var(--anz);letter-spacing:-.035em;margin:0 0 1.1rem;text-wrap:balance}
h3{font:740 1.3125rem/1.3 var(--anz);letter-spacing:-.02em;margin:3rem 0 1rem;padding-bottom:.45rem;border-bottom:1px solid var(--linie)}
h4{font:780 .8125rem/1.5 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--akzent);margin:2rem 0 .6rem}
p{margin:0 0 1.1rem}
.unter{font-size:1.1875rem;line-height:1.5;color:var(--grau)}
.klein{font-size:.9375rem}
a{color:var(--akzent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:#F0C4AD}
a:hover{text-decoration-color:var(--akzent)}
strong{font-weight:730}
ol,ul{padding-left:1.4rem;margin:0 0 1.1rem}
li{margin-bottom:.42rem}
li>ul,li>ol{margin-top:.42rem}
hr{border:0;border-top:1px solid var(--linie);margin:2.5rem 0}
code{font:.9em var(--mono);background:var(--flaeche);padding:.1em .3em}
mark{background:#FFE9A8;color:inherit;padding:.05em .2em}

.kapitel,.teil{padding-top:3.5rem;margin-top:5rem;border-top:1px solid var(--linie)}
.kapitel-kopf{margin-bottom:2.5rem;padding:1.75rem 2rem 1.9rem;background:var(--grund);border:1px solid var(--linie);border-radius:var(--radius)}
.kapitel-kopf h2{margin-bottom:.9rem}
.kapitel-nr{margin:0 0 .6rem;font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--akzent)}
.kam-dran{margin:1rem 0 0;font-size:.875rem;font-weight:550;color:var(--grau)}
.kam-dran span{white-space:nowrap}
.kam-dran span+span::before{content:"·";margin:0 .55em;color:#B9BCC4;font-weight:700}

/* Sprunglink-Zeilen: Wegweiser, keine Überschriften. Zurückgenommen und einzeilig gedacht. */
nav.kapitel-wege{margin:.95rem 0 0;font-size:.8438rem;line-height:1.95}
nav.kapitel-wege a{color:var(--grau);text-decoration:none;font-weight:650}
nav.kapitel-wege a:hover{color:var(--akzent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
nav.kapitel-wege a+a::before{content:"·";margin:0 .6em;color:#B9BCC4;font-weight:700}
nav.begriffsliste{margin:.85rem 0 .1rem;max-width:min(62rem,100%);font-size:.8438rem;line-height:1.95}
nav.begriffsliste a{color:var(--akzent);text-decoration:none;font-weight:650}
nav.begriffsliste a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
nav.begriffsliste a+a::before{content:"·";margin:0 .55em;color:#B9BCC4;font-weight:700}

section[id$="-begriffe"]{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(23rem,100%),1fr));gap:1.25rem 1.75rem;align-items:start}
section[id$="-begriffe"]>:not(dl){grid-column:1/-1}
section[id$="-begriffe"]>h3{margin-bottom:0}
section[id$="-begriffe"]>h3::after{content:"Nicht am Stück lesen. Lies den nächsten Abschnitt und komm zurück, wenn dir ein Wort fehlt.";display:block;margin-top:.45rem;font:500 .9rem/1.45 var(--sans);letter-spacing:0;text-transform:none;color:var(--grau)}

/* Eine Karte ist EIN Begriff mit EINER Erklärung. Darunter, deutlich leiser,
   die drei Zusatzzeilen. Deshalb keine Linie unter dem Begriff und nur eine
   einzige Trennlinie oberhalb der Zusatzzeilen. */
dl.begriff{border:1px solid var(--linie);border-radius:var(--radius);padding:1.35rem 1.5rem 1.2rem;margin:0;background:var(--papier)}
dl.begriff dt{font:760 1.125rem/1.3 var(--anz);letter-spacing:-.022em;margin:0 0 .55rem}
dl.begriff dt .en{font-weight:450;color:var(--grau);font-size:.9375rem;letter-spacing:0}
dl.begriff dd{margin:0}
dl.begriff .label{display:block;margin-bottom:.12rem;font-size:.6563rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--akzent)}
dl.begriff dd p{margin:0;font-size:1rem;line-height:1.62}
/* "Was es ist": normaler Absatz. Die Beschriftung bleibt für Vorleseprogramme,
   ist aber unsichtbar, weil sie direkt unter dem Begriff nichts erklärt. */
dl.begriff dd:first-of-type>.label{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
dl.begriff dd+dd{margin-top:.5rem;font-size:.875rem;line-height:1.55;color:var(--grau)}
dl.begriff dd:nth-of-type(2){margin-top:1.05rem;padding-top:.9rem;border-top:1px solid var(--linie)}
dl.begriff dd+dd>.label{display:inline;margin:0 .5em 0 0;font-size:.6563rem;font-weight:800;letter-spacing:.11em;color:#8B8F98}
dl.begriff dd+dd p{display:inline;font-size:inherit;line-height:inherit}

figure.abb{margin:2.25rem 0;padding:1.25rem 1.5rem 1rem;border:1px solid var(--linie);border-radius:var(--radius);background:var(--papier)}
figure.abb svg{display:block;width:100%;height:auto;max-width:min(58rem,100%);margin:0 auto}
figure.abb figcaption{margin-top:.9rem;padding-top:.7rem;border-top:1px solid var(--linie);font-size:.875rem;font-weight:550;color:var(--grau);line-height:1.5}
.abb svg .l{fill:none;stroke:var(--tinte);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.abb svg .f{fill:var(--flaeche);stroke:var(--tinte);stroke-width:2}
.abb svg .w{fill:var(--papier);stroke:var(--tinte);stroke-width:2}
.abb svg .a{fill:none;stroke:var(--akzent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.abb svg .fa{fill:var(--akzent);stroke:none}
.abb svg .d{fill:none;stroke:var(--grau);stroke-width:1.25;stroke-dasharray:5 3}
.abb svg .g{fill:none;stroke:var(--linie);stroke-width:1}
.abb svg text{font:13px var(--sans);font-weight:550;fill:var(--tinte)}
.abb svg .t2{font-size:11.5px;font-weight:500;fill:var(--grau)}
.abb svg .tb{font-weight:780}
.abb svg .ta{fill:var(--akzent);font-weight:800}
.abb svg .mono{font-family:var(--mono);font-weight:500}
.abb svg .mitte{text-anchor:middle}
.abb svg .rechts{text-anchor:end}

.tabelle{overflow-x:auto;margin:1.75rem 0;border:1px solid var(--linie);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:.9375rem}
caption{text-align:left;font-size:.875rem;font-weight:550;color:var(--grau);padding:.85rem .85rem .6rem;line-height:1.5}
th{text-align:left;font-weight:800;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;padding:.6rem .85rem;background:var(--flaeche);color:var(--grau);border-bottom:1px solid var(--tinte);vertical-align:bottom}
td{padding:.65rem .85rem;border-bottom:1px solid var(--linie);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.hervor td:first-child{border-left:3px solid var(--akzent)}
td.z,th.z{text-align:right;font-variant-numeric:tabular-nums}
tr.summe td{font-weight:800;border-top:2px solid var(--tinte);background:var(--grund)}
tr.hervor td{background:var(--akzent-hell);font-weight:700}

pre.rechenweg{font:.9375rem/1.85 var(--mono);background:var(--flaeche);border-left:4px solid var(--akzent);border-radius:0 var(--radius) var(--radius) 0;padding:1rem 1.4rem;margin:1.75rem 0;max-width:min(62rem,100%);white-space:pre-wrap;overflow-x:auto}
.merke{background:var(--akzent-hell);border-left:4px solid var(--akzent);border-radius:0 var(--radius) var(--radius) 0;padding:1rem 1.4rem;margin:2rem 0;max-width:min(62rem,100%)}
.merke::before{content:attr(data-art);display:block;margin-bottom:.4rem;font-size:.6875rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--akzent)}
.merke p{margin:0 0 .6rem;font-size:1rem}
.merke p:last-child{margin-bottom:0}

.aufgabe{margin:2rem 0;padding:1.4rem 1.6rem 1.5rem;border:1px solid var(--linie);border-radius:var(--radius);background:var(--grund);max-width:min(62rem,100%)}
.herkunft{margin:0 0 .9rem;font-size:.8125rem;font-weight:750;letter-spacing:.03em;text-transform:uppercase;color:var(--akzent)}
.aufgabe .text p:last-child{margin-bottom:.5rem}

details{margin:1rem 0 0}
summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:.6rem;padding:.5rem 1rem;border:1.5px solid var(--tinte);border-radius:999px;background:var(--papier);font-size:.8125rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tinte)}
summary:hover{background:var(--akzent-hell)}
details[open] summary{background:var(--tinte);color:var(--papier)}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font-size:1.15em;font-weight:700;line-height:1;color:var(--akzent)}
details[open] summary::before{content:"–";color:var(--papier)}
details .inhalt{padding:1rem 0 .25rem}
details .inhalt>*:last-child{margin-bottom:0}

sup.q{font-size:.66rem;line-height:0;vertical-align:super;font-weight:800}
sup.q a{text-decoration:none;padding:0 .1em;color:var(--akzent)}
ol.quellenliste{font-size:.875rem;line-height:1.6;padding-left:1.6rem}
ol.quellenliste li{margin-bottom:.65rem;color:var(--grau)}
ol.quellenliste a{word-break:break-word}
.typ{display:inline-block;margin-right:.45em;padding:.06em .45em;background:var(--flaeche);color:var(--tinte);border:1px solid var(--linie);border-radius:4px;font-size:.6563rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;vertical-align:.08em}
.abruf{color:#8B8F98}
.wo{margin-left:.4em;font-size:.8125rem;font-weight:700;color:#8B8F98}
.wo a{color:#8B8F98;text-decoration:none}

ul.glossar{columns:2;column-gap:2.5rem;list-style:none;padding:0;font-size:.9375rem;line-height:1.7}
ul.glossar li{break-inside:avoid;margin:0}
ol.selbstcheck>li{margin-bottom:1rem;font-weight:600;font-size:1.0625rem}

@media (max-width:1100px){
  html{font-size:16.5px}
  body{display:block}
  nav.inhalt{position:static;height:auto;border-right:0;border-bottom:1px solid var(--linie);padding:1.25rem}
  nav.inhalt ol{columns:2;column-gap:1.5rem}
  main{padding:2.25rem 1.25rem 6rem}
  h1{font-size:2.4rem}
  h2{font-size:1.9rem}
  ul.glossar{columns:1}
}
@media (max-width:640px){ nav.inhalt ol{columns:1} html{font-size:16px} h1{font-size:2rem} h2{font-size:1.6rem} }

@media print{
  html{font-size:10pt;background:#fff}
  body{display:block}
  nav.inhalt,nav.kapitel-wege,nav.begriffsliste{display:none}
  main{max-width:none;padding:0;margin:0}
  .kapitel,.teil{break-before:page;border-top:0;margin-top:0;padding-top:0}
  h2,h3{break-after:avoid}
  figure.abb,table,dl.begriff,pre.rechenweg,.merke,.aufgabe{break-inside:avoid}
  section[id$="-begriffe"]{display:block}
  dl.begriff{margin:0 0 1rem}
  .kapitel-kopf,.aufgabe,figure.abb{background:#fff}
  summary{color:inherit}
  a{color:inherit;text-decoration:none}
  ol.quellenliste a[href^="http"]::after{content:" " attr(href);color:#666;word-break:break-all}
  sup.q a{color:#000}
}

/* Pfeilspitzen an die Stilfarben binden */
marker#pfeil path{fill:var(--tinte)}
marker#pfeil-a path{fill:var(--akzent)}
marker#pfeil-g path{fill:var(--grau)}

<figure class="abb" data-name="Abb. B2-1"><svg viewBox="0 0 640 218" role="img" aria-labelledby="b2-abb1-t"><title id="b2-abb1-t">Symmetrisch und asymmetrisch nebeneinander</title><rect class="f" x="136" y="20" width="236" height="29"/><text x="254" y="42" class="tb mitte">Symmetrisch</text><rect class="f" x="384" y="20" width="236" height="29"/><text x="502" y="42" class="tb mitte">Asymmetrisch</text><text x="20" y="78" class="t2 tb">Schlüssel</text><rect class="w" x="136" y="57" width="236" height="31"/><text x="254" y="79" class="mitte">ein gemeinsames Geheimnis</text><rect class="w" x="384" y="57" width="236" height="31"/><text x="502" y="79" class="mitte">öffentlich und privat, ein Paar</text><text x="20" y="117" class="t2 tb">Stärke</text><rect class="w" x="136" y="96" width="236" height="48"/><text x="254" y="118" class="mitte">für große Datenmengen effizient</text><rect class="w" x="384" y="96" width="236" height="48"/><text x="502" y="118" class="mitte">Verteilung der öffentlichen</text><text x="502" y="135" class="mitte">Schlüssel ist einfach</text><text x="20" y="173" class="t2 tb">Preis</text><rect class="w" x="136" y="152" width="236" height="48"/><text x="254" y="174" class="mitte">geschützter Weg zum Geheimnis</text><text x="254" y="191" class="mitte">nötig</text><rect class="w" x="384" y="152" width="236" height="48"/><text x="502" y="174" class="mitte">mehr Rechenaufwand, Nachweis</text><text x="502" y="191" class="mitte">der Zuordnung nötig</text></svg><figcaption>Abb. B2-1: RSA und Verfahren auf elliptischen Kurven sind asymmetrisch. Nicht jedes einzelne Verfahren bietet zugleich Verschlüsselung, Schlüsselaustausch und Signaturen.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-2"><svg viewBox="0 0 640 366" role="img" aria-labelledby="b2-abb2-t"><title id="b2-abb2-t">Dieselbe Sendung in drei Verfahren: wer welchen Schlüssel hat und was auf der Leitung liegt</title><text x="320" y="20" class="mitte t2">Alice schickt Bob eine große Datei. Ein Angreifer hört die Leitung mit.</text><text x="10" y="46" class="tb">1 · symmetrisch</text><rect class="w" x="10" y="56" width="90" height="36"/><text x="55" y="79" class="mitte">Alice</text><rect class="w" x="190" y="56" width="260" height="36"/><text x="320" y="79" class="mitte">Chiffrat + Schlüssel K</text><rect class="w" x="540" y="56" width="90" height="36"/><text x="585" y="79" class="mitte">Bob</text><line class="l" x1="104" y1="74" x2="186" y2="74" marker-end="url(#pfeil)"/><line class="l" x1="454" y1="74" x2="536" y2="74" marker-end="url(#pfeil)"/><rect class="a" x="190" y="56" width="260" height="36"/><text x="10" y="108" class="t2">K geheim</text><text x="630" y="108" class="rechts t2">K geheim</text><text x="10" y="130" class="t2">Der Schlüssel muss selbst über die Leitung – wer ihn abfängt, liest mit.</text><text x="10" y="156" class="tb">2 · asymmetrisch</text><rect class="w" x="10" y="166" width="90" height="36"/><text x="55" y="189" class="mitte">Alice</text><rect class="w" x="190" y="166" width="260" height="36"/><text x="320" y="189" class="mitte">Chiffrat</text><rect class="w" x="540" y="166" width="90" height="36"/><text x="585" y="189" class="mitte">Bob</text><line class="l" x1="104" y1="184" x2="186" y2="184" marker-end="url(#pfeil)"/><line class="l" x1="454" y1="184" x2="536" y2="184" marker-end="url(#pfeil)"/><text x="10" y="218" class="t2">Bobs öffentlicher</text><text x="630" y="218" class="rechts t2">Bobs privater</text><text x="10" y="240" class="t2">Nur der öffentliche Schlüssel reist, aber für große Dateien ist das zu langsam.</text><text x="10" y="266" class="tb">3 · hybrid</text><rect class="w" x="10" y="276" width="90" height="36"/><text x="55" y="299" class="mitte">Alice</text><rect class="w" x="190" y="276" width="260" height="36"/><text x="320" y="299" class="mitte">Chiffrat + verpackter Schlüssel</text><rect class="w" x="540" y="276" width="90" height="36"/><text x="585" y="299" class="mitte">Bob</text><line class="l" x1="104" y1="294" x2="186" y2="294" marker-end="url(#pfeil)"/><line class="l" x1="454" y1="294" x2="536" y2="294" marker-end="url(#pfeil)"/><text x="10" y="328" class="t2">K neu, dazu Bobs öffentlicher</text><text x="630" y="328" class="rechts t2">Bobs privater</text><text x="10" y="350" class="t2">Der Schlüssel reist verschlossen mit, die Datei bleibt symmetrisch schnell.</text></svg><figcaption>Abb. B2-2: Eine Sendung, drei Antworten. Der Akzent zeigt die einzige Stelle, an der der Angreifer etwas Brauchbares mitbekommt: den offen mitgeschickten Schlüssel in Zeile 1.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-3"><svg viewBox="0 0 640 316" role="img" aria-labelledby="b2-abb3-t"><title id="b2-abb3-t">Dokument signieren und Signatur prüfen</title><rect class="w" x="12" y="24" width="130" height="44"/><text x="77" y="51" class="mitte">Dokument</text><line class="l" x1="146" y1="46" x2="188" y2="46" marker-end="url(#pfeil)"/><rect class="w" x="192" y="24" width="112" height="44"/><text x="248" y="51" class="mitte">Hash bilden</text><line class="l" x1="308" y1="46" x2="350" y2="46" marker-end="url(#pfeil)"/><rect class="w" x="354" y="24" width="270" height="44"/><text x="489" y="51" class="mitte">Mit privatem Schlüssel signieren</text><text x="488" y="91" class="mitte">Absender schützt seinen privaten Schlüssel.</text><line class="l" x1="488" y1="105" x2="488" y2="145" marker-end="url(#pfeil)"/><rect class="w" x="302" y="151" width="322" height="45"/><text x="463" y="178.5" class="mitte">Dokument + Signatur übertragen</text><line class="l" x1="300" y1="173" x2="242" y2="173" marker-end="url(#pfeil)"/><rect class="w" x="12" y="148" width="222" height="50"/><text x="123" y="178" class="mitte">Empfänger prüft Signatur</text><text x="126" y="226" class="mitte">Öffentlicher Schlüssel des Absenders</text><text x="126" y="247" class="mitte">und Hash des empfangenen Dokuments</text><text x="320" y="292" class="mitte">Gültig: Signatur passt zur Nachricht und zum geprüften Schlüssel.</text></svg><figcaption>Abb. B2-3: Vereinfachter Signaturablauf. Das Signaturverfahren prüft die Bindung der übertragenen Nachricht an den Schlüssel; die Nachricht bleibt ohne zusätzliche Verschlüsselung lesbar.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-4"><svg viewBox="0 0 640 218" role="img" aria-labelledby="b2-abb4-t"><title id="b2-abb4-t">Zwei Aufgaben für Hashwerte, zwei Anforderungen</title><rect class="f" x="136" y="20" width="236" height="29"/><text x="254" y="42" class="tb mitte">Download prüfen</text><rect class="f" x="384" y="20" width="236" height="29"/><text x="502" y="42" class="tb mitte">Passwort speichern</text><text x="20" y="78" class="t2 tb">Was zählt</text><rect class="w" x="136" y="57" width="236" height="31"/><text x="254" y="79" class="mitte">schnelle Berechnung</text><rect class="w" x="384" y="57" width="236" height="31"/><text x="502" y="79" class="mitte">langsame Berechnung</text><text x="20" y="117" class="t2 tb">Verfahren</text><rect class="w" x="136" y="96" width="236" height="48"/><text x="254" y="118" class="mitte">SHA-256, 64 Hexstellen</text><rect class="w" x="384" y="96" width="236" height="48"/><text x="502" y="118" class="mitte">Passwort-Hasher mit Salt und</text><text x="502" y="135" class="mitte">Aufwand</text><text x="20" y="173" class="t2 tb">Vorgehen</text><rect class="w" x="136" y="152" width="236" height="48"/><text x="254" y="174" class="mitte">Hash der Datei mit dem</text><text x="254" y="191" class="mitte">Referenzwert vergleichen</text><rect class="w" x="384" y="152" width="236" height="48"/><text x="502" y="174" class="mitte">bei der Anmeldung neu berechnen</text><text x="502" y="191" class="mitte">und vergleichen</text></svg><figcaption>Abb. B2-4: Beim Download sollen kleine Änderungen sofort auffallen. Beim Passwort soll niemand viele Kandidaten je Sekunde prüfen können.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-5"><svg viewBox="0 0 640 348" role="img" aria-labelledby="b2-abb5-t"><title id="b2-abb5-t">TLS in vier Lernschritten</title><rect class="w" x="20" y="20" width="140" height="36"/><text x="90" y="43" class="mitte">Browser</text><rect class="w" x="480" y="20" width="140" height="36"/><text x="550" y="43" class="mitte">Server</text><line class="l" x1="164" y1="86" x2="476" y2="86" marker-end="url(#pfeil)"/><text x="320" y="76" class="mitte">1 · ClientHello: Verfahren und Schlüsselaustauschdaten</text><line class="l" x1="476" y1="143" x2="164" y2="143" marker-end="url(#pfeil)"/><text x="320" y="132" class="mitte">2 · ServerHello, Zertifikat und Identitätsnachweis</text><rect class="w" x="40" y="180" width="560" height="48"/><text x="320" y="209" class="mitte">3 · Zertifikat prüfen; Sitzungsschlüssel ableiten</text><text x="320" y="254" class="mitte">Beide Seiten bestätigen den erfolgreichen Handshake.</text><line class="l" x1="164" y1="294" x2="476" y2="294" marker-end="url(#pfeil)"/><line class="l" x1="476" y1="323" x2="164" y2="323" marker-end="url(#pfeil)"/><text x="320" y="281" class="mitte">4 · HTTP-Daten symmetrisch geschützt austauschen</text></svg><figcaption>Abb. B2-5: Zertifikat und Handshake sichern die Zuordnung zum Server. Der Browser muss Zertifikatsfehler ernst nehmen; auch eine betrügerische Domain kann ein gültiges Zertifikat für ihren eigenen Namen besitzen.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-6"><svg viewBox="0 0 640 130" role="img" aria-labelledby="b2-abb6-t"><title id="b2-abb6-t">Anfang und Ende eines Standort-zu-Standort-Tunnels</title><line class="d" x1="85.2" y1="34" x2="241.8" y2="34"/><line class="d" x1="85.2" y1="34" x2="85.2" y2="44"/><line class="d" x1="241.8" y1="34" x2="241.8" y2="44"/><text x="163.5" y="27" class="t2 mitte">ohne Tunnelschutz</text><line class="d" x1="398.2" y1="34" x2="554.8" y2="34"/><line class="d" x1="398.2" y1="34" x2="398.2" y2="44"/><line class="d" x1="554.8" y1="34" x2="554.8" y2="44"/><text x="476.5" y="27" class="t2 mitte">ohne Tunnelschutz</text><rect class="w" x="20" y="52" width="130.5" height="30"/><text x="85.2" y="72" class="t2 mitte">Filiale</text><line class="l" x1="150.5" y1="67" x2="176.5" y2="67"/><rect class="w" x="176.5" y="52" width="130.5" height="30"/><text x="241.8" y="72" class="t2 mitte">Gateway</text><line class="l" x1="307" y1="67" x2="333" y2="67"/><rect class="w" x="333" y="52" width="130.5" height="30"/><text x="398.2" y="72" class="t2 mitte">Gateway</text><line class="l" x1="463.5" y1="67" x2="489.5" y2="67"/><rect class="w" x="489.5" y="52" width="130.5" height="30"/><text x="554.8" y="72" class="t2 mitte">Zentrale</text><line class="a" x1="241.8" y1="98" x2="398.2" y2="98"/><line class="a" x1="241.8" y1="98" x2="241.8" y2="88"/><line class="a" x1="398.2" y1="98" x2="398.2" y2="88"/><text x="320" y="116" class="ta mitte">Tunnel durch das fremde Netz</text></svg><figcaption>Abb. B2-6: Der Schutz endet am jeweiligen Tunnelendpunkt. Bei geteiltem Routing läuft anderer Verkehr außerhalb des VPN.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-7"><svg viewBox="0 0 640 130" role="img" aria-labelledby="b2-abb7-t"><title id="b2-abb7-t">Transportverschlüsselung abschnittsweise, Ende-zu-Ende durchgehend</title><line class="d" x1="85.2" y1="34" x2="241.8" y2="34"/><line class="d" x1="85.2" y1="34" x2="85.2" y2="44"/><line class="d" x1="241.8" y1="34" x2="241.8" y2="44"/><text x="163.5" y="27" class="t2 mitte">TLS</text><line class="d" x1="241.8" y1="34" x2="398.2" y2="34"/><line class="d" x1="241.8" y1="34" x2="241.8" y2="44"/><line class="d" x1="398.2" y1="34" x2="398.2" y2="44"/><text x="320" y="27" class="t2 mitte">TLS</text><line class="d" x1="398.2" y1="34" x2="554.8" y2="34"/><line class="d" x1="398.2" y1="34" x2="398.2" y2="44"/><line class="d" x1="554.8" y1="34" x2="554.8" y2="44"/><text x="476.5" y="27" class="t2 mitte">TLS</text><rect class="w" x="20" y="52" width="130.5" height="30"/><text x="85.2" y="72" class="t2 mitte">Absender</text><line class="l" x1="150.5" y1="67" x2="176.5" y2="67"/><rect class="w" x="176.5" y="52" width="130.5" height="30"/><text x="241.8" y="72" class="t2 mitte">Mailserver</text><line class="l" x1="307" y1="67" x2="333" y2="67"/><rect class="w" x="333" y="52" width="130.5" height="30"/><text x="398.2" y="72" class="t2 mitte">Mailserver</text><line class="l" x1="463.5" y1="67" x2="489.5" y2="67"/><rect class="w" x="489.5" y="52" width="130.5" height="30"/><text x="554.8" y="72" class="t2 mitte">Empfänger</text><line class="a" x1="85.2" y1="98" x2="554.8" y2="98"/><line class="a" x1="85.2" y1="98" x2="85.2" y2="88"/><line class="a" x1="554.8" y1="98" x2="554.8" y2="88"/><text x="320" y="116" class="ta mitte">S/MIME oder OpenPGP</text></svg><figcaption>Abb. B2-7: TLS schützt jeweils eine Verbindung; die Server können den Inhalt verarbeiten. Ende-zu-Ende schützt den Inhalt auch gegenüber den Servern, aber nicht alle Metadaten und kein kompromittiertes Endgerät.</figcaption></figure>
<pre id="out"></pre>
<script>
const out = [];
const rects = (a, b) => !(a.x + a.width <= b.x || b.x + b.width <= a.x || a.y + a.height <= b.y || b.y + b.height <= a.y);
document.querySelectorAll('figure.abb').forEach(fig => {
  const name = fig.dataset.name, svg = fig.querySelector('svg');
  const vb = svg.viewBox.baseVal; const texts = [...svg.querySelectorAll('text')];
  const boxes = texts.map(t => { const b = t.getBBox(); return {t, b, s: (t.textContent || '').trim()}; });
  boxes.forEach(({b, s}) => {
    if (b.width === 0) return;
    if (b.x < vb.x - 1 || b.y < vb.y - 1 || b.x + b.width > vb.x + vb.width + 1 || b.y + b.height > vb.y + vb.height + 1)
      out.push(name + ' | RAND | "' + s + '" ragt aus dem Bild (x ' + Math.round(b.x) + '..' + Math.round(b.x + b.width) + ', y ' + Math.round(b.y) + '..' + Math.round(b.y + b.height) + ', Bild ' + vb.width + 'x' + vb.height + ')');
  });
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const A = boxes[i], B = boxes[j]; if (!A.s || !B.s) continue;
    if (rects(A.b, B.b)) {
      const ix = Math.min(A.b.x + A.b.width, B.b.x + B.b.width) - Math.max(A.b.x, B.b.x);
      const iy = Math.min(A.b.y + A.b.height, B.b.y + B.b.height) - Math.max(A.b.y, B.b.y);
      if (ix > 2 && iy > 2) out.push(name + ' | TEXT-TEXT | "' + A.s + '" ueberlappt "' + B.s + '" (' + Math.round(ix) + 'x' + Math.round(iy) + ')');
    }
  }
  const rs = [...svg.querySelectorAll('rect')].map(r => ({x: +r.getAttribute('x') || 0, y: +r.getAttribute('y') || 0, w: +r.getAttribute('width') || 0, h: +r.getAttribute('height') || 0}));
  boxes.forEach(({b, s}) => {
    if (!s) return; const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    rs.forEach(r => { if (cx > r.x && cx < r.x + r.w && cy > r.y && cy < r.y + r.h && (b.x < r.x - 1 || b.x + b.width > r.x + r.w + 1))
      out.push(name + ' | BOX | "' + s + '" breiter als seine Box (Text ' + Math.round(b.width) + ', Box ' + r.w + ')'); });
  });
});
document.title = 'FERTIG';
document.getElementById('out').textContent = out.join('\n') || 'Keine Befunde.';
</script></body></html>
