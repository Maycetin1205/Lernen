<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
/* STIL B · Werkstatt, Fassung 2026-09-07: breiter Rahmen, Karten statt schwarzer Balken, ruhige Linien, ein warmer Akzent. */
:root{
  --papier:#ffffff; --grund:#FAFAF9; --flaeche:#F5F4F2;
  --tinte:#0D0F14; --grau:#5A5F6B; --linie:#E3E2DF; --linie-stark:#0D0F14;
  --akzent:#C4400C; --akzent-hell:#FDF0E8; --akzent-tief:#8F2E08;
  --nav-b:18.5rem; --inhalt-b:78rem; --text-b:74ch; --radius:12px;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Inter",Roboto,Arial,sans-serif;
  --anz:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Inter",Roboto,Arial,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",monospace;
}
*{box-sizing:border-box}
html{background:var(--papier);color:var(--tinte);font:17.5px/1.62 var(--sans);-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:2rem;-webkit-font-smoothing:antialiased}
body{margin:0;display:grid;grid-template-columns:var(--nav-b) minmax(0,1fr)}

nav.inhalt{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;min-width:0;background:var(--grund);border-right:1px solid var(--linie);padding:1.75rem 1.1rem 4rem;font-size:.8438rem;line-height:1.35}
nav.inhalt .nav-titel{margin:0 .6rem 1.75rem;font:780 1.125rem/1.15 var(--anz);letter-spacing:-.03em;text-transform:uppercase}
nav.inhalt .nav-titel a{color:var(--tinte);text-decoration:none}
nav.inhalt .nav-gruppe{margin:1.75rem .6rem .5rem;font-size:.6875rem;font-weight:780;letter-spacing:.12em;text-transform:uppercase;color:var(--grau)}
nav.inhalt ol{list-style:none;margin:0;padding:0}
nav.inhalt li a{display:flex;gap:.5rem;padding:.4rem .6rem;border-radius:8px;color:var(--grau);text-decoration:none;font-weight:500}
nav.inhalt li a:hover{color:var(--tinte);background:var(--flaeche)}
nav.inhalt li a.aktuell{color:var(--tinte);font-weight:750;background:var(--akzent-hell)}
nav.inhalt .nr{flex:0 0 2.2em;font-weight:780;color:#B9BCC4;font-variant-numeric:tabular-nums}
nav.inhalt li a:hover .nr,nav.inhalt li a.aktuell .nr{color:var(--akzent)}
nav.inhalt ol.nav-schnell{margin:0 0 1.6rem;padding-bottom:1.2rem;border-bottom:1px solid var(--linie)}
nav.inhalt ol.nav-schnell li a{font-weight:750;color:var(--tinte)}
nav.inhalt ol.nav-schnell li a:hover{color:var(--akzent)}

/* min-width:0 ist der Kern: ohne das wächst main auf die Breite seines breitesten
   Inhalts (der Matrix-Tabelle) und schiebt die ganze Seite über den Bildschirm. */
main{min-width:0;max-width:min(var(--inhalt-b),100%);padding:3.5rem clamp(1.5rem,4vw,4.5rem) 10rem;margin:0 auto}
main p,main ul:not(.glossar),main ol,main .unter{max-width:min(var(--text-b),100%)}
header.titel{padding-bottom:2.5rem;border-bottom:1px solid var(--linie);margin-bottom:1rem}
header.titel+.teil{margin-top:2.5rem;border-top:0;padding-top:1rem}
h1{font:800 clamp(2.2rem,3.4vw,3rem)/1.04 var(--anz);letter-spacing:-.04em;margin:0 0 1.1rem;text-wrap:balance}
h2{font:780 2.35rem/1.08 var(--anz);letter-spacing:-.035em;margin:0 0 1.1rem;text-wrap:balance}
h3{font:740 1.3125rem/1.3 var(--anz);letter-spacing:-.02em;margin:3rem 0 1rem;padding-bottom:.45rem;border-bottom:1px solid var(--linie)}
h4{font:780 .8125rem/1.5 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--akzent);margin:2rem 0 .6rem}
p{margin:0 0 1.1rem}
.unter{font-size:1.1875rem;line-height:1.5;color:var(--grau)}
.klein{font-size:.9375rem}
a{color:var(--akzent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:#F0C4AD}
a:hover{text-decoration-color:var(--akzent)}
strong{font-weight:730}
ol,ul{padding-left:1.4rem;margin:0 0 1.1rem}
li{margin-bottom:.42rem}
li>ul,li>ol{margin-top:.42rem}
hr{border:0;border-top:1px solid var(--linie);margin:2.5rem 0}
code{font:.9em var(--mono);background:var(--flaeche);padding:.1em .3em}
mark{background:#FFE9A8;color:inherit;padding:.05em .2em}

.kapitel,.teil{padding-top:3.5rem;margin-top:5rem;border-top:1px solid var(--linie)}
.kapitel-kopf{margin-bottom:2.5rem;padding:1.75rem 2rem 1.9rem;background:var(--grund);border:1px solid var(--linie);border-radius:var(--radius)}
.kapitel-kopf h2{margin-bottom:.9rem}
.kapitel-nr{margin:0 0 .6rem;font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--akzent)}
.kam-dran{margin:1rem 0 0;font-size:.875rem;font-weight:550;color:var(--grau)}
.kam-dran span{white-space:nowrap}
.kam-dran span+span::before{content:"·";margin:0 .55em;color:#B9BCC4;font-weight:700}

/* Sprunglink-Zeilen: Wegweiser, keine Überschriften. Zurückgenommen und einzeilig gedacht. */
nav.kapitel-wege{margin:.95rem 0 0;font-size:.8438rem;line-height:1.95}
nav.kapitel-wege a{color:var(--grau);text-decoration:none;font-weight:650}
nav.kapitel-wege a:hover{color:var(--akzent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
nav.kapitel-wege a+a::before{content:"·";margin:0 .6em;color:#B9BCC4;font-weight:700}
nav.begriffsliste{margin:.85rem 0 .1rem;max-width:min(62rem,100%);font-size:.8438rem;line-height:1.95}
nav.begriffsliste a{color:var(--akzent);text-decoration:none;font-weight:650}
nav.begriffsliste a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
nav.begriffsliste a+a::before{content:"·";margin:0 .55em;color:#B9BCC4;font-weight:700}

section[id$="-begriffe"]{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(23rem,100%),1fr));gap:1.25rem 1.75rem;align-items:start}
section[id$="-begriffe"]>:not(dl){grid-column:1/-1}
section[id$="-begriffe"]>h3{margin-bottom:0}
section[id$="-begriffe"]>h3::after{content:"Nicht am Stück lesen. Lies den nächsten Abschnitt und komm zurück, wenn dir ein Wort fehlt.";display:block;margin-top:.45rem;font:500 .9rem/1.45 var(--sans);letter-spacing:0;text-transform:none;color:var(--grau)}

/* Eine Karte ist EIN Begriff mit EINER Erklärung. Darunter, deutlich leiser,
   die drei Zusatzzeilen. Deshalb keine Linie unter dem Begriff und nur eine
   einzige Trennlinie oberhalb der Zusatzzeilen. */
dl.begriff{border:1px solid var(--linie);border-radius:var(--radius);padding:1.35rem 1.5rem 1.2rem;margin:0;background:var(--papier)}
dl.begriff dt{font:760 1.125rem/1.3 var(--anz);letter-spacing:-.022em;margin:0 0 .55rem}
dl.begriff dt .en{font-weight:450;color:var(--grau);font-size:.9375rem;letter-spacing:0}
dl.begriff dd{margin:0}
dl.begriff .label{display:block;margin-bottom:.12rem;font-size:.6563rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--akzent)}
dl.begriff dd p{margin:0;font-size:1rem;line-height:1.62}
/* "Was es ist": normaler Absatz. Die Beschriftung bleibt für Vorleseprogramme,
   ist aber unsichtbar, weil sie direkt unter dem Begriff nichts erklärt. */
dl.begriff dd:first-of-type>.label{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
dl.begriff dd+dd{margin-top:.5rem;font-size:.875rem;line-height:1.55;color:var(--grau)}
dl.begriff dd:nth-of-type(2){margin-top:1.05rem;padding-top:.9rem;border-top:1px solid var(--linie)}
dl.begriff dd+dd>.label{display:inline;margin:0 .5em 0 0;font-size:.6563rem;font-weight:800;letter-spacing:.11em;color:#8B8F98}
dl.begriff dd+dd p{display:inline;font-size:inherit;line-height:inherit}

figure.abb{margin:2.25rem 0;padding:1.25rem 1.5rem 1rem;border:1px solid var(--linie);border-radius:var(--radius);background:var(--papier)}
figure.abb svg{display:block;width:100%;height:auto;max-width:min(58rem,100%);margin:0 auto}
figure.abb figcaption{margin-top:.9rem;padding-top:.7rem;border-top:1px solid var(--linie);font-size:.875rem;font-weight:550;color:var(--grau);line-height:1.5}
.abb svg .l{fill:none;stroke:var(--tinte);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.abb svg .f{fill:var(--flaeche);stroke:var(--tinte);stroke-width:2}
.abb svg .w{fill:var(--papier);stroke:var(--tinte);stroke-width:2}
.abb svg .a{fill:none;stroke:var(--akzent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.abb svg .fa{fill:var(--akzent);stroke:none}
.abb svg .d{fill:none;stroke:var(--grau);stroke-width:1.25;stroke-dasharray:5 3}
.abb svg .g{fill:none;stroke:var(--linie);stroke-width:1}
.abb svg text{font:13px var(--sans);font-weight:550;fill:var(--tinte)}
.abb svg .t2{font-size:11.5px;font-weight:500;fill:var(--grau)}
.abb svg .tb{font-weight:780}
.abb svg .ta{fill:var(--akzent);font-weight:800}
.abb svg .mono{font-family:var(--mono);font-weight:500}
.abb svg .mitte{text-anchor:middle}
.abb svg .rechts{text-anchor:end}

.tabelle{overflow-x:auto;margin:1.75rem 0;border:1px solid var(--linie);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:.9375rem}
caption{text-align:left;font-size:.875rem;font-weight:550;color:var(--grau);padding:.85rem .85rem .6rem;line-height:1.5}
th{text-align:left;font-weight:800;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;padding:.6rem .85rem;background:var(--flaeche);color:var(--grau);border-bottom:1px solid var(--tinte);vertical-align:bottom}
td{padding:.65rem .85rem;border-bottom:1px solid var(--linie);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.hervor td:first-child{border-left:3px solid var(--akzent)}
td.z,th.z{text-align:right;font-variant-numeric:tabular-nums}
tr.summe td{font-weight:800;border-top:2px solid var(--tinte);background:var(--grund)}
tr.hervor td{background:var(--akzent-hell);font-weight:700}

pre.rechenweg{font:.9375rem/1.85 var(--mono);background:var(--flaeche);border-left:4px solid var(--akzent);border-radius:0 var(--radius) var(--radius) 0;padding:1rem 1.4rem;margin:1.75rem 0;max-width:min(62rem,100%);white-space:pre-wrap;overflow-x:auto}
.merke{background:var(--akzent-hell);border-left:4px solid var(--akzent);border-radius:0 var(--radius) var(--radius) 0;padding:1rem 1.4rem;margin:2rem 0;max-width:min(62rem,100%)}
.merke::before{content:attr(data-art);display:block;margin-bottom:.4rem;font-size:.6875rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--akzent)}
.merke p{margin:0 0 .6rem;font-size:1rem}
.merke p:last-child{margin-bottom:0}

.aufgabe{margin:2rem 0;padding:1.4rem 1.6rem 1.5rem;border:1px solid var(--linie);border-radius:var(--radius);background:var(--grund);max-width:min(62rem,100%)}
.herkunft{margin:0 0 .9rem;font-size:.8125rem;font-weight:750;letter-spacing:.03em;text-transform:uppercase;color:var(--akzent)}
.aufgabe .text p:last-child{margin-bottom:.5rem}

details{margin:1rem 0 0}
summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:.6rem;padding:.5rem 1rem;border:1.5px solid var(--tinte);border-radius:999px;background:var(--papier);font-size:.8125rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tinte)}
summary:hover{background:var(--akzent-hell)}
details[open] summary{background:var(--tinte);color:var(--papier)}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font-size:1.15em;font-weight:700;line-height:1;color:var(--akzent)}
details[open] summary::before{content:"–";color:var(--papier)}
details .inhalt{padding:1rem 0 .25rem}
details .inhalt>*:last-child{margin-bottom:0}
details.wegweiser .tabelle{margin:1rem 0 0}

/* Teil 2 als Pruefungsansicht: Kapitelkuerzel in der Zielspalte, Strichliste, Rueckweg-Leiste.
   Strichliste und Leiste entstehen erst im Skript in 99-fuss.html; ohne JavaScript bleibt Teil 2 wie bisher. */
#matrix td .kap{display:block;font-size:.6875rem;font-weight:800;letter-spacing:.1em;color:var(--grau)}
#matrix caption .stand{font-weight:750;color:var(--akzent)}
/* Erst lernen / Dann pruefen sollen zwei Zeilen bleiben, auch wenn beide selbst umbrechen. */
#matrix td .kap ~ a{display:block;margin-top:.28rem}
#matrix td .kap ~ br{display:none}
#matrix input[type=checkbox]{width:1.05rem;height:1.05rem;margin:.15rem 0 0;accent-color:var(--akzent)}
#matrix tr:target td{background:var(--akzent-hell)}
#rueckweg{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tinte);padding:.65rem 1rem;text-align:center}
#rueckweg a{color:var(--papier);font-size:.9375rem;font-weight:650;text-decoration-color:#7C818C}
#rueckweg a:hover{text-decoration-color:var(--papier)}

sup.q{font-size:.66rem;line-height:0;vertical-align:super;font-weight:800}
sup.q a{text-decoration:none;padding:0 .1em;color:var(--akzent)}
ol.quellenliste{font-size:.875rem;line-height:1.6;padding-left:1.6rem}
ol.quellenliste li{margin-bottom:.65rem;color:var(--grau)}
ol.quellenliste a{word-break:break-word}
.typ{display:inline-block;margin-right:.45em;padding:.06em .45em;background:var(--flaeche);color:var(--tinte);border:1px solid var(--linie);border-radius:4px;font-size:.6563rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;vertical-align:.08em}
.abruf{color:#8B8F98}
.wo{margin-left:.4em;font-size:.8125rem;font-weight:700;color:#8B8F98}
.wo a{color:#8B8F98;text-decoration:none}

ul.glossar{columns:2;column-gap:2.5rem;list-style:none;padding:0;font-size:.9375rem;line-height:1.7}
ul.glossar li{break-inside:avoid;margin:0}
ol.selbstcheck>li{margin-bottom:1rem;font-weight:600;font-size:1.0625rem}

@media (max-width:1100px){
  html{font-size:16.5px}
  body{display:block}
  nav.inhalt{position:static;height:auto;border-right:0;border-bottom:1px solid var(--linie);padding:1.25rem}
  nav.inhalt ol{columns:2;column-gap:1.5rem}
  main{padding:2.25rem 1.25rem 6rem}
  h1{font-size:2.4rem}
  h2{font-size:1.9rem}
  ul.glossar{columns:1}
}
@media (max-width:640px){ nav.inhalt ol{columns:1} html{font-size:16px} h1{font-size:2rem} h2{font-size:1.6rem} }

@media print{
  html{font-size:10pt;background:#fff}
  body{display:block}
  nav.inhalt,nav.kapitel-wege,nav.begriffsliste,#rueckweg{display:none}
  main{max-width:none;padding:0;margin:0}
  .kapitel,.teil{break-before:page;border-top:0;margin-top:0;padding-top:0}
  h2,h3{break-after:avoid}
  figure.abb,table,dl.begriff,pre.rechenweg,.merke,.aufgabe{break-inside:avoid}
  section[id$="-begriffe"]{display:block}
  dl.begriff{margin:0 0 1rem}
  .kapitel-kopf,.aufgabe,figure.abb{background:#fff}
  summary{color:inherit}
  details[open] summary{background:#fff;color:#000}
  details[open] summary::before{color:#000}
  a{color:inherit;text-decoration:none}
  ol.quellenliste a[href^="http"]::after{content:" " attr(href);color:#666;word-break:break-all}
  sup.q a{color:#000}
}

/* Pfeilspitzen an die Stilfarben binden */
marker#pfeil path{fill:var(--tinte)}
marker#pfeil-a path{fill:var(--akzent)}
marker#pfeil-g path{fill:var(--grau)}

<figure class="abb" data-name="Abb. A1-3">
    <svg viewBox="0 0 640 230" role="img" aria-labelledby="a1-abb3-t">
      <title id="a1-abb3-t">Präfix 26 teilt 32 Bits in 26 Netzbits und 6 Hostbits</title>

eight="20"/><rect class="f" x="95" y="130" width="14" height="20"/><rect class="f" x="112" y="130" width="14" height="20"/><rect class="f" x="129" y="130" width="14" height="20"/><rect class="f" x="146" y="130" width="14" height="20"/><rect class="f" x="163" y="130" width="14" height="20"/><rect class="f" x="180" y="130" width="14" height="20"/><rect class="f" x="197" y="130" width="14" height="20"/><rect class="f" x="214" y="130" width="14" height="20"/><rect class="f" x="231" y="130" width="14" height="20"/><rect class="f" x="248" y="130" width="14" height="20"/><rect class="f" x="265" y="130" width="14" height="20"/><rect class="f" x="282" y="130" width="14" height="20"/><rect class="f" x="299" y="130" width="14" height="20"/><rect class="f" x="316" y="130" width="14" height="20"/><rect class="f" x="333" y="130" width="14" height="20"/><text x="10" y="170" class="t2">Durchprobieren lohnt nicht mehr. Wer dasselbe Passwort woanders nutzt, verliert diesen Vorteil.</text><text x="10" y="198" class="tb">3 · lang plus zweiter Faktor</text><rect class="f" x="10" y="206" width="14" height="20"/><rect class="f" x="27" y="206" width="14" height="20"/><rect class="f" x="44" y="206" width="14" height="20"/><rect class="f" x="61" y="206" width="14" height="20"/><rect class="f" x="78" y="206" width="14" height="20"/><rect class="f" x="95" y="206" width="14" height="20"/><rect class="f" x="112" y="206" width="14" height="20"/><rect class="f" x="129" y="206" width="14" height="20"/><rect class="f" x="146" y="206" width="14" height="20"/><rect class="f" x="163" y="206" width="14" height="20"/><rect class="f" x="180" y="206" width="14" height="20"/><rect class="f" x="197" y="206" width="14" height="20"/><rect class="f" x="214" y="206" width="14" height="20"/><rect class="f" x="231" y="206" width="14" height="20"/><rect class="f" x="248" y="206" width="14" height="20"/><rect class="f" x="265" y="206" width="14" height="20"/><rect class="f" x="282" y="206" width="14" height="20"/><rect class="f" x="299" y="206" width="14" height="20"/><rect class="f" x="316" y="206" width="14" height="20"/><rect class="f" x="333" y="206" width="14" height="20"/><rect class="w" x="354" y="206" width="140" height="20"/><text x="424" y="221" class="mitte t2">Code vom Handy</text><text x="10" y="246" class="t2">Selbst mit dem richtigen Passwort fehlt dem Angreifer das Gerät für den Code.</text></svg><figcaption>Abb. B1-8: Eine Lage, drei Antworten. Der Akzent zeigt die Stelle, an der der Angreifer durchkommt: das kurze Passwort.</figcaption></figure>
<figure class="abb" data-name="Abb. B1-4"><svg viewBox="0 0 640 270" role="img" aria-labelledby="b1-abb4-t"><title id="b1-abb4-t">Vier Schritte vor der Freigabe eines Geräts</title><rect class="w" x="20" y="20" width="600" height="48"/><text x="36" y="49" class="ta">1</text><text x="58" y="41" class="tb">Aufnehmen</text><text x="606" y="41" class="t2 rechts">Modell, Firmwarestand, Supportstatus, benötigte</text><text x="606" y="57" class="t2 rechts">Funktionen</text><line class="l" x1="320" y1="72" x2="320" y2="85" marker-end="url(#pfeil)"/><rect class="a" x="20" y="92" width="600" height="48"/><text x="36" y="121" class="ta">2</text><text x="58" y="113" class="tb">Update beziehen</text><text x="606" y="113" class="t2 rechts">vertrauenswürdige Herstellerquelle, Signatur</text><text x="606" y="129" class="t2 rechts">prüfen</text><line class="l" x1="320" y1="144" x2="320" y2="157" marker-end="url(#pfeil)"/><rect class="w" x="20" y="164" width="600" height="31"/><text x="36" y="184.5" class="ta">3</text><text x="58" y="185" class="tb">Testen</text><text x="606" y="185" class="t2 rechts">Änderung testen, Rückkehrmöglichkeit planen</text><line class="l" x1="320" y1="199" x2="320" y2="212" marker-end="url(#pfeil)"/><rect class="w" x="20" y="219" width="600" height="31"/><text x="36" y="239.5" class="ta">4</text><text x="58" y="240" class="tb">Dokumentieren</text><text x="606" y="240" class="t2 rechts">Ergebnis festhalten</text></svg><figcaption>Abb. B1-4: Vier Schritte vor der Freigabe. Im Akzent der Schritt, der die Lücken schließt: das Update aus der echten Herstellerquelle.</figcaption></figure>
<figure class="abb" data-name="Abb. B1-5"><svg viewBox="0 0 640 283" role="img" aria-labelledby="b1-abb5-t"><title id="b1-abb5-t">Fünf Eingriffe der Härtung</title><rect class="w" x="20" y="20" width="292" height="73"/><text x="34" y="45" class="ta">1</text><text x="54" y="45" class="tb">Unnötige Dienste</text><text x="54" y="66" class="t2">entfernen oder deaktivieren</text><rect class="w" x="328" y="20" width="292" height="73"/><text x="342" y="45" class="ta">2</text><text x="362" y="45" class="tb">Voreingestellte Zugangsdaten</text><text x="362" y="66" class="t2">ersetzen</text><rect class="w" x="20" y="105" width="292" height="73"/><text x="34" y="130" class="ta">3</text><text x="54" y="130" class="tb">Erlaubte Verbindungen</text><text x="54" y="151" class="t2">begrenzen</text><rect class="w" x="328" y="105" width="292" height="73"/><text x="342" y="130" class="ta">4</text><text x="362" y="130" class="tb">Eigener Gastzugang</text><text x="362" y="151" class="t2">ohne Freigabe interner Ressourcen</text><rect class="a" x="20" y="190" width="292" height="73"/><text x="34" y="215" class="ta">5</text><text x="54" y="215" class="tb">Lieferung prüfen</text><text x="54" y="236" class="t2">unbekannte USB-Geräte, unerwartete</text><text x="54" y="251" class="t2">Komponenten</text></svg><figcaption>Abb. B1-5: Fünf Eingriffe, jeder nimmt genau einen Einstieg weg. Eine unbeschädigte Verpackung ist kein Nachweis dafür, dass die Lieferung unverändert ist.</figcaption></figure>
<figure class="abb" data-name="Abb. B1-6"><svg viewBox="0 0 640 320" role="img" aria-labelledby="b1-abb6-t"><title id="b1-abb6-t">Fünf Warnzeichen einer erfundenen Nachricht</title><rect class="w" x="25" y="20" width="590" height="280"/><text x="45" y="52" class="mono">1  Von: support@konto-pruefung.example</text><text x="45" y="87" class="mono">2  Betreff: Ihr Konto wird sofort gesperrt</text><text x="45" y="132" class="mono">3  Hallo Kunde,</text><text x="45" y="170" class="mono">4  Bitte Passwort und TAN übermitteln.</text><text x="45" y="218" class="mono">5  Ziel: fremdes-portal.example/anmeldung</text><line class="a" x1="45" y1="230" x2="565" y2="230"/><text x="320" y="274" class="t2 mitte">Absender · Druck · Anrede · Geheimnisse · Linkziel</text></svg><figcaption>Abb. B1-6: Fünf Warnzeichen: fremder Absender, Zeitdruck, unpersönliche Anrede, Abfrage von Geheimnissen, fremdes Linkziel. Kein einzelnes Merkmal beweist den Angriff, aber eine unerwartete Geheimnisabfrage verlangt immer eine unabhängige Prüfung.</figcaption></figure>
<figure class="abb" data-name="Abb. B1-7"><svg viewBox="0 0 640 121" role="img" aria-labelledby="b1-abb7-t"><title id="b1-abb7-t">Risikobegründung an einem Beispiel</title><rect class="w" x="20" y="22" width="177.3" height="79"/><text x="108.7" y="46" class="tb mitte">Ursache</text><text x="108.7" y="69" class="t2 mitte">ungeschütztes WLAN</text><line class="l" x1="202.3" y1="61.5" x2="225.3" y2="61.5" marker-end="url(#pfeil)"/><rect class="w" x="231.3" y="22" width="177.3" height="79"/><text x="320" y="46" class="tb mitte">Mögliche Handlung</text><text x="320" y="69" class="t2 mitte">Unbefugte erreichen</text><text x="320" y="84" class="t2 mitte">interne Dienste</text><line class="l" x1="413.7" y1="61.5" x2="436.7" y2="61.5" marker-end="url(#pfeil)"/><rect class="a" x="442.7" y="22" width="177.3" height="79"/><text x="531.3" y="46" class="tb mitte">Schaden</text><text x="531.3" y="69" class="t2 mitte">Kundendaten werden</text><text x="531.3" y="84" class="t2 mitte">offengelegt</text></svg><figcaption>Abb. B1-7: Ursache, Handlung, Schaden. Passe die mittlere Station an die tatsächlich erreichbaren Dienste an: Aus einer Funkverbindung folgt nicht Zugriff auf jede Datei.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-1"><svg viewBox="0 0 640 218" role="img" aria-labelledby="b2-abb1-t"><title id="b2-abb1-t">Symmetrisch und asymmetrisch nebeneinander</title><rect class="f" x="136" y="20" width="236" height="29"/><text x="254" y="42" class="tb mitte">Symmetrisch</text><rect class="f" x="384" y="20" width="236" height="29"/><text x="502" y="42" class="tb mitte">Asymmetrisch</text><text x="20" y="78" class="t2 tb">Schlüssel</text><rect class="w" x="136" y="57" width="236" height="31"/><text x="254" y="79" class="mitte">ein gemeinsames Geheimnis</text><rect class="w" x="384" y="57" width="236" height="31"/><text x="502" y="79" class="mitte">öffentlich und privat, ein Paar</text><text x="20" y="117" class="t2 tb">Stärke</text><rect class="w" x="136" y="96" width="236" height="48"/><text x="254" y="118" class="mitte">für große Datenmengen effizient</text><rect class="w" x="384" y="96" width="236" height="48"/><text x="502" y="118" class="mitte">Verteilung der öffentlichen</text><text x="502" y="135" class="mitte">Schlüssel ist einfach</text><text x="20" y="173" class="t2 tb">Preis</text><rect class="w" x="136" y="152" width="236" height="48"/><text x="254" y="174" class="mitte">geschützter Weg zum Geheimnis</text><text x="254" y="191" class="mitte">nötig</text><rect class="w" x="384" y="152" width="236" height="48"/><text x="502" y="174" class="mitte">mehr Rechenaufwand, Nachweis</text><text x="502" y="191" class="mitte">der Zuordnung nötig</text></svg><figcaption>Abb. B2-1: RSA und Verfahren auf elliptischen Kurven sind asymmetrisch. Nicht jedes einzelne Verfahren bietet zugleich Verschlüsselung, Schlüsselaustausch und Signaturen.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-2"><svg viewBox="0 0 640 366" role="img" aria-labelledby="b2-abb2-t"><title id="b2-abb2-t">Dieselbe Sendung in drei Verfahren: wer welchen Schlüssel hat und was auf der Leitung liegt</title><text x="320" y="20" class="mitte t2">Alice schickt Bob eine große Datei. Ein Angreifer hört die Leitung mit.</text><text x="10" y="46" class="tb">1 · symmetrisch</text><rect class="w" x="10" y="56" width="90" height="36"/><text x="55" y="79" class="mitte">Alice</text><rect class="w" x="190" y="56" width="260" height="36"/><text x="320" y="79" class="mitte">Chiffrat + Schlüssel K</text><rect class="w" x="540" y="56" width="90" height="36"/><text x="585" y="79" class="mitte">Bob</text><line class="l" x1="104" y1="74" x2="186" y2="74" marker-end="url(#pfeil)"/><line class="l" x1="454" y1="74" x2="536" y2="74" marker-end="url(#pfeil)"/><rect class="a" x="190" y="56" width="260" height="36"/><text x="10" y="108" class="t2">K geheim</text><text x="630" y="108" class="rechts t2">K geheim</text><text x="10" y="130" class="t2">Der Schlüssel muss selbst über die Leitung – wer ihn abfängt, liest mit.</text><text x="10" y="156" class="tb">2 · asymmetrisch</text><rect class="w" x="10" y="166" width="90" height="36"/><text x="55" y="189" class="mitte">Alice</text><rect class="w" x="190" y="166" width="260" height="36"/><text x="320" y="189" class="mitte">Chiffrat</text><rect class="w" x="540" y="166" width="90" height="36"/><text x="585" y="189" class="mitte">Bob</text><line class="l" x1="104" y1="184" x2="186" y2="184" marker-end="url(#pfeil)"/><line class="l" x1="454" y1="184" x2="536" y2="184" marker-end="url(#pfeil)"/><text x="10" y="218" class="t2">Bobs öffentlicher</text><text x="630" y="218" class="rechts t2">Bobs privater</text><text x="10" y="240" class="t2">Nur der öffentliche Schlüssel reist, aber für große Dateien ist das zu langsam.</text><text x="10" y="266" class="tb">3 · hybrid</text><rect class="w" x="10" y="276" width="90" height="36"/><text x="55" y="299" class="mitte">Alice</text><rect class="w" x="190" y="276" width="260" height="36"/><text x="320" y="299" class="mitte">Chiffrat + verpackter Schlüssel</text><rect class="w" x="540" y="276" width="90" height="36"/><text x="585" y="299" class="mitte">Bob</text><line class="l" x1="104" y1="294" x2="186" y2="294" marker-end="url(#pfeil)"/><line class="l" x1="454" y1="294" x2="536" y2="294" marker-end="url(#pfeil)"/><text x="10" y="328" class="t2">K neu, dazu Bobs öffentlicher</text><text x="630" y="328" class="rechts t2">Bobs privater</text><text x="10" y="350" class="t2">Der Schlüssel reist verschlossen mit, die Datei bleibt symmetrisch schnell.</text></svg><figcaption>Abb. B2-2: Eine Sendung, drei Antworten. Der Akzent zeigt die einzige Stelle, an der der Angreifer etwas Brauchbares mitbekommt: den offen mitgeschickten Schlüssel in Zeile 1.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-3"><svg viewBox="0 0 640 316" role="img" aria-labelledby="b2-abb3-t"><title id="b2-abb3-t">Dokument signieren und Signatur prüfen</title><rect class="w" x="12" y="24" width="130" height="44"/><text x="77" y="51" class="mitte">Dokument</text><line class="l" x1="146" y1="46" x2="188" y2="46" marker-end="url(#pfeil)"/><rect class="w" x="192" y="24" width="112" height="44"/><text x="248" y="51" class="mitte">Hash bilden</text><line class="l" x1="308" y1="46" x2="350" y2="46" marker-end="url(#pfeil)"/><rect class="w" x="354" y="24" width="270" height="44"/><text x="489" y="51" class="mitte">Mit privatem Schlüssel signieren</text><text x="488" y="91" class="mitte">Absender schützt seinen privaten Schlüssel.</text><line class="l" x1="488" y1="105" x2="488" y2="145" marker-end="url(#pfeil)"/><rect class="w" x="302" y="151" width="322" height="45"/><text x="463" y="178.5" class="mitte">Dokument + Signatur übertragen</text><line class="l" x1="300" y1="173" x2="242" y2="173" marker-end="url(#pfeil)"/><rect class="w" x="12" y="148" width="222" height="50"/><text x="123" y="178" class="mitte">Empfänger prüft Signatur</text><text x="126" y="226" class="mitte">Öffentlicher Schlüssel des Absenders</text><text x="126" y="247" class="mitte">und Hash des empfangenen Dokuments</text><text x="320" y="292" class="mitte">Gültig: Signatur passt zur Nachricht und zum geprüften Schlüssel.</text></svg><figcaption>Abb. B2-3: Vereinfachter Signaturablauf. Das Signaturverfahren prüft die Bindung der übertragenen Nachricht an den Schlüssel; die Nachricht bleibt ohne zusätzliche Verschlüsselung lesbar.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-4"><svg viewBox="0 0 640 218" role="img" aria-labelledby="b2-abb4-t"><title id="b2-abb4-t">Zwei Aufgaben für Hashwerte, zwei Anforderungen</title><rect class="f" x="136" y="20" width="236" height="29"/><text x="254" y="42" class="tb mitte">Download prüfen</text><rect class="f" x="384" y="20" width="236" height="29"/><text x="502" y="42" class="tb mitte">Passwort speichern</text><text x="20" y="78" class="t2 tb">Was zählt</text><rect class="w" x="136" y="57" width="236" height="31"/><text x="254" y="79" class="mitte">schnelle Berechnung</text><rect class="w" x="384" y="57" width="236" height="31"/><text x="502" y="79" class="mitte">langsame Berechnung</text><text x="20" y="117" class="t2 tb">Verfahren</text><rect class="w" x="136" y="96" width="236" height="48"/><text x="254" y="118" class="mitte">SHA-256, 64 Hexstellen</text><rect class="w" x="384" y="96" width="236" height="48"/><text x="502" y="118" class="mitte">Passwort-Hasher mit Salt und</text><text x="502" y="135" class="mitte">Aufwand</text><text x="20" y="173" class="t2 tb">Vorgehen</text><rect class="w" x="136" y="152" width="236" height="48"/><text x="254" y="174" class="mitte">Hash der Datei mit dem</text><text x="254" y="191" class="mitte">Referenzwert vergleichen</text><rect class="w" x="384" y="152" width="236" height="48"/><text x="502" y="174" class="mitte">bei der Anmeldung neu berechnen</text><text x="502" y="191" class="mitte">und vergleichen</text></svg><figcaption>Abb. B2-4: Beim Download sollen kleine Änderungen sofort auffallen. Beim Passwort soll niemand viele Kandidaten je Sekunde prüfen können.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-5"><svg viewBox="0 0 640 348" role="img" aria-labelledby="b2-abb5-t"><title id="b2-abb5-t">TLS in vier Lernschritten</title><rect class="w" x="20" y="20" width="140" height="36"/><text x="90" y="43" class="mitte">Browser</text><rect class="w" x="480" y="20" width="140" height="36"/><text x="550" y="43" class="mitte">Server</text><line class="l" x1="164" y1="86" x2="476" y2="86" marker-end="url(#pfeil)"/><text x="320" y="76" class="mitte">1 · ClientHello: Verfahren und Schlüsselaustauschdaten</text><line class="l" x1="476" y1="143" x2="164" y2="143" marker-end="url(#pfeil)"/><text x="320" y="132" class="mitte">2 · ServerHello, Zertifikat und Identitätsnachweis</text><rect class="w" x="40" y="180" width="560" height="48"/><text x="320" y="209" class="mitte">3 · Zertifikat prüfen; Sitzungsschlüssel ableiten</text><text x="320" y="254" class="mitte">Beide Seiten bestätigen den erfolgreichen Handshake.</text><line class="l" x1="164" y1="294" x2="476" y2="294" marker-end="url(#pfeil)"/><line class="l" x1="476" y1="323" x2="164" y2="323" marker-end="url(#pfeil)"/><text x="320" y="281" class="mitte">4 · HTTP-Daten symmetrisch geschützt austauschen</text></svg><figcaption>Abb. B2-5: Zertifikat und Handshake sichern die Zuordnung zum Server. Der Browser muss Zertifikatsfehler ernst nehmen; auch eine betrügerische Domain kann ein gültiges Zertifikat für ihren eigenen Namen besitzen.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-6"><svg viewBox="0 0 640 130" role="img" aria-labelledby="b2-abb6-t"><title id="b2-abb6-t">Anfang und Ende eines Standort-zu-Standort-Tunnels</title><line class="d" x1="85.2" y1="34" x2="241.8" y2="34"/><line class="d" x1="85.2" y1="34" x2="85.2" y2="44"/><line class="d" x1="241.8" y1="34" x2="241.8" y2="44"/><text x="163.5" y="27" class="t2 mitte">ohne Tunnelschutz</text><line class="d" x1="398.2" y1="34" x2="554.8" y2="34"/><line class="d" x1="398.2" y1="34" x2="398.2" y2="44"/><line class="d" x1="554.8" y1="34" x2="554.8" y2="44"/><text x="476.5" y="27" class="t2 mitte">ohne Tunnelschutz</text><rect class="w" x="20" y="52" width="130.5" height="30"/><text x="85.2" y="72" class="t2 mitte">Filiale</text><line class="l" x1="150.5" y1="67" x2="176.5" y2="67"/><rect class="w" x="176.5" y="52" width="130.5" height="30"/><text x="241.8" y="72" class="t2 mitte">Gateway</text><line class="l" x1="307" y1="67" x2="333" y2="67"/><rect class="w" x="333" y="52" width="130.5" height="30"/><text x="398.2" y="72" class="t2 mitte">Gateway</text><line class="l" x1="463.5" y1="67" x2="489.5" y2="67"/><rect class="w" x="489.5" y="52" width="130.5" height="30"/><text x="554.8" y="72" class="t2 mitte">Zentrale</text><line class="a" x1="241.8" y1="98" x2="398.2" y2="98"/><line class="a" x1="241.8" y1="98" x2="241.8" y2="88"/><line class="a" x1="398.2" y1="98" x2="398.2" y2="88"/><text x="320" y="116" class="ta mitte">Tunnel durch das fremde Netz</text></svg><figcaption>Abb. B2-6: Der Schutz endet am jeweiligen Tunnelendpunkt. Bei geteiltem Routing läuft anderer Verkehr außerhalb des VPN.</figcaption></figure>
<figure class="abb" data-name="Abb. B2-7"><svg viewBox="0 0 640 130" role="img" aria-labelledby="b2-abb7-t"><title id="b2-abb7-t">Transportverschlüsselung abschnittsweise, Ende-zu-Ende durchgehend</title><line class="d" x1="85.2" y1="34" x2="241.8" y2="34"/><line class="d" x1="85.2" y1="34" x2="85.2" y2="44"/><line class="d" x1="241.8" y1="34" x2="241.8" y2="44"/><text x="163.5" y="27" class="t2 mitte">TLS</text><line class="d" x1="241.8" y1="34" x2="398.2" y2="34"/><line class="d" x1="241.8" y1="34" x2="241.8" y2="44"/><line class="d" x1="398.2" y1="34" x2="398.2" y2="44"/><text x="320" y="27" class="t2 mitte">TLS</text><line class="d" x1="398.2" y1="34" x2="554.8" y2="34"/><line class="d" x1="398.2" y1="34" x2="398.2" y2="44"/><line class="d" x1="554.8" y1="34" x2="554.8" y2="44"/><text x="476.5" y="27" class="t2 mitte">TLS</text><rect class="w" x="20" y="52" width="130.5" height="30"/><text x="85.2" y="72" class="t2 mitte">Absender</text><line class="l" x1="150.5" y1="67" x2="176.5" y2="67"/><rect class="w" x="176.5" y="52" width="130.5" height="30"/><text x="241.8" y="72" class="t2 mitte">Mailserver</text><line class="l" x1="307" y1="67" x2="333" y2="67"/><rect class="w" x="333" y="52" width="130.5" height="30"/><text x="398.2" y="72" class="t2 mitte">Mailserver</text><line class="l" x1="463.5" y1="67" x2="489.5" y2="67"/><rect class="w" x="489.5" y="52" width="130.5" height="30"/><text x="554.8" y="72" class="t2 mitte">Empfänger</text><line class="a" x1="85.2" y1="98" x2="554.8" y2="98"/><line class="a" x1="85.2" y1="98" x2="85.2" y2="88"/><line class="a" x1="554.8" y1="98" x2="554.8" y2="88"/><text x="320" y="116" class="ta mitte">S/MIME oder OpenPGP</text></svg><figcaption>Abb. B2-7: TLS schützt jeweils eine Verbindung; die Server können den Inhalt verarbeiten. Ende-zu-Ende schützt den Inhalt auch gegenüber den Servern, aber nicht alle Metadaten und kein kompromittiertes Endgerät.</figcaption></figure>
<figure class="abb" data-name="Abb. B3-1"><svg viewBox="0 0 640 277" role="img" aria-labelledby="b3-abb1-t"><title id="b3-abb1-t">Rollen und Wege im Datenschutz</title><rect class="w" x="18" y="22" width="244" height="48"/><text x="140" y="51" class="mitte">Betroffene Person</text><rect class="w" x="18" y="190" width="244" height="48"/><text x="140" y="219" class="mitte">Verantwortlicher: Händler</text><rect class="w" x="377" y="190" width="245" height="48"/><text x="499.5" y="219" class="mitte">Auftragsverarbeiter: IT-Betrieb</text><rect class="w" x="377" y="22" width="245" height="48"/><text x="499.5" y="51" class="mitte">Aufsichtsbehörde</text><line class="l" x1="40" y1="77" x2="40" y2="182" marker-end="url(#pfeil)"/><text x="140" y="118" class="mitte">Auskunft verlangen</text><line class="l" x1="240" y1="182" x2="240" y2="77" marker-end="url(#pfeil)"/><text x="140" y="153" class="mitte">Auskunft erteilen</text><line class="l" x1="268" y1="212" x2="370" y2="212" marker-end="url(#pfeil)"/><text x="320" y="195" class="mitte">Vertrag</text><text x="320" y="241" class="mitte">Art. 28</text><line class="l" x1="267" y1="183" x2="405" y2="79" marker-end="url(#pfeil)"/><text x="388" y="144" class="mitte">Meldung, falls erforderlich</text></svg><figcaption>Abb. B3-1: Der Händler entscheidet über Zwecke. Der IT-Dienst verarbeitet im Auftrag und unterstützt ihn. Die betroffene Person richtet ihre Rechte an den Verantwortlichen; der eingezeichnete Meldeweg betrifft Art. 33.</figcaption></figure>
<figure class="abb" data-name="Abb. B3-2"><svg viewBox="0 0 640 206" role="img" aria-labelledby="b3-abb2-t"><title id="b3-abb2-t">Die sieben Grundsatzgruppen der DSGVO</title><rect class="w" x="4" y="18" width="86" height="128"/><text x="47" y="43" class="mitte">1</text><text x="47" y="68" class="mitte">Rechtmäßig,</text><text x="47" y="93" class="mitte">fair,</text><text x="47" y="118" class="mitte">transparent</text><rect class="w" x="95" y="18" width="86" height="128"/><text x="138" y="43" class="mitte">2</text><text x="138" y="68" class="mitte">Zweck-</text><text x="138" y="93" class="mitte">bindung</text><text x="138" y="118" class="mitte"></text><rect class="w" x="186" y="18" width="86" height="128"/><text x="229" y="43" class="mitte">3</text><text x="229" y="68" class="mitte">Daten-</text><text x="229" y="93" class="mitte">minimierung</text><text x="229" y="118" class="mitte"></text><rect class="w" x="277" y="18" width="86" height="128"/><text x="320" y="43" class="mitte">4</text><text x="320" y="68" class="mitte">Richtigkeit</text><text x="320" y="93" class="mitte"></text><text x="320" y="118" class="mitte"></text><rect class="w" x="368" y="18" width="86" height="128"/><text x="411" y="43" class="mitte">5</text><text x="411" y="68" class="mitte">Speicher-</text><text x="411" y="93" class="mitte">begrenzung</text><text x="411" y="118" class="mitte"></text><rect class="w" x="459" y="18" width="86" height="128"/><text x="502" y="43" class="mitte">6</text><text x="502" y="68" class="mitte">Integrität,</text><text x="502" y="93" class="mitte">Vertrau-</text><text x="502" y="118" class="mitte">lichkeit</text><rect class="w" x="550" y="18" width="86" height="128"/><text x="593" y="43" class="mitte">7</text><text x="593" y="68" class="mitte">Rechen-</text><text x="593" y="93" class="mitte">schafts-</text><text x="593" y="118" class="mitte">pflicht</text><text x="320" y="183" class="mitte">Für jede Gruppe muss die Verarbeitung begründbar und überprüfbar sein.</text></svg><figcaption>Abb. B3-2: Die Reihe ist eine Lernordnung, keine Rangfolge: Alle einschlägigen Grundsätze sind gemeinsam einzuhalten.</figcaption></figure>
<figure class="abb" data-name="Abb. B3-3"><svg viewBox="0 0 640 215" role="img" aria-labelledby="b3-abb3-t"><title id="b3-abb3-t">Drei Prüfschritte bis zur Rechtsgrundlage</title><rect class="w" x="20" y="20" width="600" height="31"/><text x="36" y="40.5" class="ta">1</text><text x="58" y="41" class="tb">Zweck bestimmen</text><text x="606" y="41" class="t2 rechts">welche Daten wofür verarbeitet werden</text><line class="l" x1="320" y1="55" x2="320" y2="68" marker-end="url(#pfeil)"/><rect class="w" x="20" y="75" width="600" height="48"/><text x="36" y="104" class="ta">2</text><text x="58" y="96" class="tb">Grundlage nach Art. 6 wählen</text><text x="606" y="96" class="t2 rechts">Vertrag, rechtliche Pflicht, berechtigtes</text><text x="606" y="112" class="t2 rechts">Interesse, Einwilligung</text><line class="l" x1="320" y1="127" x2="320" y2="140" marker-end="url(#pfeil)"/><rect class="a" x="20" y="147" width="600" height="48"/><text x="36" y="176" class="ta">3</text><text x="58" y="168" class="tb">Besondere Kategorie prüfen</text><text x="606" y="168" class="t2 rechts">bei Gesundheitsdaten zusätzlich eine Ausnahme</text><text x="606" y="184" class="t2 rechts">nach Art. 9</text></svg><figcaption>Abb. B3-3: Die Angabe einer Grundlage nach Art. 6 genügt bei Gesundheitsdaten nicht. Welche Ausnahme passt, hängt vom Zweck und den besonderen Vorschriften ab.</figcaption></figure>
<figure class="abb" data-name="Abb. B3-4"><svg viewBox="0 0 640 162" role="img" aria-labelledby="b3-abb4-t"><title id="b3-abb4-t">Information und Auskunft auseinanderhalten</title><rect class="f" x="132" y="20" width="238" height="29"/><text x="251" y="42" class="tb mitte">Information, Art. 13 und 14</text><rect class="f" x="382" y="20" width="238" height="29"/><text x="501" y="42" class="tb mitte">Auskunft, Art. 15</text><text x="20" y="78" class="t2 tb">Anlass</text><rect class="w" x="132" y="57" width="238" height="31"/><text x="251" y="79" class="mitte">die Erhebung der Daten</text><rect class="w" x="382" y="57" width="238" height="31"/><text x="501" y="79" class="mitte">ein konkreter Antrag</text><text x="20" y="117" class="t2 tb">Inhalt</text><rect class="w" x="132" y="96" width="238" height="48"/><text x="251" y="118" class="mitte">worüber vorab zu informieren ist</text><rect class="w" x="382" y="96" width="238" height="48"/><text x="501" y="118" class="mitte">Zwecke, Empfänger,</text><text x="501" y="135" class="mitte">Speicherdauer, Datenkopie</text></svg><figcaption>Abb. B3-4: Bei begründeten Zweifeln an der Identität werden angemessene zusätzliche Informationen angefordert, damit die Auskunft nicht selbst Daten an Unbefugte offenlegt.</figcaption></figure>
<figure class="abb" data-name="Abb. B3-5"><svg viewBox="0 0 640 121" role="img" aria-labelledby="b3-abb5-t"><title id="b3-abb5-t">Frist für die Antwort auf einen Antrag</title><rect class="w" x="20" y="22" width="177.3" height="79"/><text x="108.7" y="46" class="tb mitte">Antrag geht ein</text><line class="l" x1="202.3" y1="61.5" x2="225.3" y2="61.5" marker-end="url(#pfeil)"/><rect class="w" x="231.3" y="22" width="177.3" height="79"/><text x="320" y="46" class="tb mitte">Ein Monat</text><text x="320" y="69" class="t2 mitte">Antwort über die</text><text x="320" y="84" class="t2 mitte">ergriffenen Maßnahmen</text><line class="l" x1="413.7" y1="61.5" x2="436.7" y2="61.5" marker-end="url(#pfeil)"/><rect class="a" x="442.7" y="22" width="177.3" height="79"/><text x="531.3" y="46" class="tb mitte">Zwei weitere Monate</text><text x="531.3" y="69" class="t2 mitte">nur bei Komplexität oder</text><text x="531.3" y="84" class="t2 mitte">vielen Anträgen</text></svg><figcaption>Abb. B3-5: Über die Verlängerung und ihre Gründe muss bereits innerhalb des ersten Monats informiert werden. Ein Monat ist keine pauschale Gleichsetzung mit 30 Tagen.</figcaption></figure>
<figure class="abb" data-name="Abb. B3-6"><svg viewBox="0 0 640 181" role="img" aria-labelledby="b3-abb6-t"><title id="b3-abb6-t">Weg einer gemeldeten Datenschutzverletzung</title><rect class="w" x="20" y="20" width="600" height="31"/><text x="36" y="40.5" class="ta">1</text><text x="58" y="41" class="tb">Dokumentieren</text><text x="606" y="41" class="t2 rechts">Sachverhalt, Auswirkungen, Abhilfemaßnahmen</text><line class="l" x1="320" y1="55" x2="320" y2="68" marker-end="url(#pfeil)"/><rect class="a" x="20" y="75" width="600" height="31"/><text x="36" y="95.5" class="ta">2</text><text x="58" y="96" class="tb">Aufsicht melden</text><text x="606" y="96" class="t2 rechts">unverzüglich, möglichst binnen 72 Stunden</text><line class="l" x1="320" y1="110" x2="320" y2="123" marker-end="url(#pfeil)"/><rect class="w" x="20" y="130" width="600" height="31"/><text x="36" y="150.5" class="ta">3</text><text x="58" y="151" class="tb">Betroffene benachrichtigen</text><text x="606" y="151" class="t2 rechts">nur bei voraussichtlich hohem Risiko</text></svg><figcaption>Abb. B3-6: Besteht voraussichtlich kein Risiko für Rechte und Freiheiten, entfällt die Meldung an die Aufsicht. Ein Auftragsverarbeiter informiert den Verantwortlichen unverzüglich, ohne selbst dessen Frist auszuschöpfen.</figcaption></figure>
<figure class="abb" data-name="Abb. B3-7"><svg viewBox="0 0 640 145" role="img" aria-labelledby="b3-abb7-t"><title id="b3-abb7-t">Die zwei Bußgeldrahmen des Art. 83</title><rect class="f" x="156" y="20" width="226" height="29"/><text x="269" y="42" class="tb mitte">Erster Rahmen</text><rect class="a" x="394" y="20" width="226" height="29"/><text x="507" y="42" class="tb mitte">Zweiter Rahmen</text><text x="20" y="78" class="t2 tb">Festbetrag</text><rect class="w" x="156" y="57" width="226" height="31"/><text x="269" y="79" class="mitte">bis 10 Millionen Euro</text><rect class="w" x="394" y="57" width="226" height="31"/><text x="507" y="79" class="mitte">bis 20 Millionen Euro</text><text x="20" y="117" class="t2 tb">Anteil am Umsatz</text><rect class="w" x="156" y="96" width="226" height="31"/><text x="269" y="118" class="mitte">bis 2 Prozent</text><rect class="w" x="394" y="96" width="226" height="31"/><text x="507" y="118" class="mitte">bis 4 Prozent</text></svg><figcaption>Abb. B3-7: Gemeint ist der weltweite Vorjahresumsatz eines Unternehmens; maßgeblich ist jeweils der höhere Betrag. Das sind Obergrenzen, keine automatischen Rechnungsbeträge.</figcaption></figure>
<figure class="abb" data-name="Abb. B4-1"><svg viewBox="0 0 640 200" role="img" aria-labelledby="b4-abb1-t"><title id="b4-abb1-t">Weg der Daten vom Laufwerk über Arbeitsspeicher und Cache zum Prozessor</title>
<rect class="w" x="20" y="44" width="128" height="84"/><text x="84" y="72" class="mitte tb">Laufwerk</text><text x="84" y="92" class="mitte t2">SSD oder HDD</text><text x="84" y="110" class="mitte t2">Terabyte, dauerhaft</text>
<line class="l" x1="148" y1="86" x2="166" y2="86" marker-end="url(#pfeil)"/>
<rect class="w" x="172" y="44" width="128" height="84"/><text x="236" y="72" class="mitte tb">RAM</text><text x="236" y="92" class="mitte t2">Arbeitsspeicher</text><text x="236" y="110" class="mitte t2">Gigabyte, flüchtig</text>
<line class="l" x1="300" y1="86" x2="318" y2="86" marker-end="url(#pfeil)"/>
<rect class="w" x="324" y="44" width="128" height="84"/><rect class="a" x="324" y="44" width="128" height="84"/><text x="388" y="72" class="mitte tb">Cache</text><text x="388" y="92" class="mitte t2">Zwischenspeicher</text><text x="388" y="110" class="mitte t2">Megabyte, am Kern</text>
<line class="l" x1="452" y1="86" x2="470" y2="86" marker-end="url(#pfeil)"/>
<rect class="w" x="476" y="44" width="128" height="84"/><text x="540" y="72" class="mitte tb">CPU</text><text x="540" y="92" class="mitte t2">Prozessor</text><text x="540" y="110" class="mitte t2">rechnet</text>
<line class="l" x1="330" y1="166" x2="600" y2="166" marker-end="url(#pfeil)"/><text x="465" y="156" class="mitte t2">schneller, aber kleiner</text>
<line class="l" x1="294" y1="166" x2="24" y2="166" marker-end="url(#pfeil)"/><text x="159" y="156" class="mitte t2">größer, aber langsamer</text>
</svg><figcaption>Abb. B4-1: Je näher am Prozessor, desto schneller und kleiner der Speicher. Der Cache hält bereit, was gerade oft gebraucht wird, und spart Zugriffe auf den langsameren RAM.</figcaption></figure>
<figure class="abb" data-name="Abb. B4-2"><svg viewBox="0 0 640 116" role="img" aria-labelledby="b4-abb2-t"><title id="b4-abb2-t">Wie aus Kernen logische Prozessoren werden</title><rect class="w" x="20" y="36" width="166.7" height="60"/><text x="103.3" y="56" class="t2 mitte">Kerne</text><text x="103.3" y="86" class="tb mitte">4</text><line class="l" x1="192.7" y1="66" x2="228.7" y2="66" marker-end="url(#pfeil)"/><text x="214.7" y="25" class="t2 mitte">mal</text><rect class="w" x="236.7" y="36" width="166.7" height="60"/><text x="320" y="56" class="t2 mitte">Threads je Kern</text><text x="320" y="86" class="tb mitte">2</text><line class="l" x1="409.3" y1="66" x2="445.3" y2="66" marker-end="url(#pfeil)"/><text x="431.3" y="25" class="t2 mitte">ergibt</text><rect class="a" x="453.3" y="36" width="166.7" height="60"/><text x="536.7" y="56" class="t2 mitte">Logische Prozessoren</text><text x="536.7" y="86" class="tb mitte">8</text></svg><figcaption>Abb. B4-2: Kerne mal Threads je Kern ergibt die logischen Prozessoren. Acht logische Prozessoren sind keine acht Kerne und bringen nicht bei jedem Programm doppeltes Tempo.</figcaption></figure>
<figure class="abb" data-name="Abb. B4-3"><svg viewBox="0 0 640 325" role="img" aria-labelledby="b4-abb3-t"><title id="b4-abb3-t">Fünf Schritte beim Einsetzen einer CPU</title><rect class="w" x="20" y="20" width="600" height="31"/><text x="36" y="40.5" class="ta">1</text><text x="58" y="41" class="tb">Gerät ausschalten und trennen</text><text x="606" y="41" class="t2 rechts">nach Herstelleranleitung, Entladungen vermeiden</text><line class="l" x1="320" y1="55" x2="320" y2="68" marker-end="url(#pfeil)"/><rect class="w" x="20" y="75" width="600" height="48"/><text x="36" y="104" class="ta">2</text><text x="58" y="96" class="tb">Modell, Sockel und Freigabe</text><text x="58" y="113" class="tb">prüfen</text><line class="l" x1="320" y1="127" x2="320" y2="140" marker-end="url(#pfeil)"/><rect class="w" x="20" y="147" width="600" height="48"/><text x="36" y="176" class="ta">3</text><text x="58" y="168" class="tb">Halterung öffnen, Markierung</text><text x="58" y="185" class="tb">ausrichten</text><line class="l" x1="320" y1="199" x2="320" y2="212" marker-end="url(#pfeil)"/><rect class="a" x="20" y="219" width="600" height="31"/><text x="36" y="239.5" class="ta">4</text><text x="58" y="240" class="tb">CPU ohne Kraft einsetzen</text><text x="606" y="240" class="t2 rechts">Kontakte nicht berühren</text><line class="l" x1="320" y1="254" x2="320" y2="267" marker-end="url(#pfeil)"/><rect class="w" x="20" y="274" width="600" height="31"/><text x="36" y="294.5" class="ta">5</text><text x="58" y="295" class="tb">Halterung schließen</text><text x="606" y="295" class="t2 rechts">nach Anleitung</text></svg><figcaption>Abb. B4-3: Die IHK fragt die drei Schritte Hebel öffnen, CPU einsetzen, Hebel schließen. Die Punkte 1, 2 und 5 gehören zu jeder Montage.</figcaption></figure>
<figure class="abb" data-name="Abb. B4-4"><svg viewBox="0 0 640 116" role="img" aria-labelledby="b4-abb4-t"><title id="b4-abb4-t">Von der aufgedruckten Zahl zum tatsächlichen Takt</title><rect class="w" x="20" y="36" width="166.7" height="60"/><text x="103.3" y="56" class="t2 mitte">Aufgedruckte Zahl</text><text x="103.3" y="86" class="tb mitte">DDR-3200</text><line class="l" x1="192.7" y1="66" x2="228.7" y2="66" marker-end="url(#pfeil)"/><text x="214.7" y="25" class="t2 mitte">bedeutet</text><rect class="w" x="236.7" y="36" width="166.7" height="60"/><text x="320" y="56" class="t2 mitte">Effektive Datenrate</text><text x="320" y="86" class="tb mitte">3200 MT/s</text><line class="l" x1="409.3" y1="66" x2="445.3" y2="66" marker-end="url(#pfeil)"/><text x="431.3" y="25" class="t2 mitte">geteilt durch 2</text><rect class="a" x="453.3" y="36" width="166.7" height="60"/><text x="536.7" y="56" class="t2 mitte">I/O-Takt</text><text x="536.7" y="86" class="tb mitte">1600 MHz</text></svg><figcaption>Abb. B4-4: Übertragen wird an beiden Taktflanken. Prüfungshefte und Händlertexte schreiben häufig verkürzt „3200 MHz“; übernimm die Aufgabenangabe, verwechsle aber die Größe nicht mit dem Takt.</figcaption></figure>

xt><path class="w" d="M507,280 h58 l15,14 v40 h-88 v-40 Z"/><path class="l" d="M516,304 v16 M536,290 v16 M556,304 v16"/><text x="536" y="359" class="mitte">IEC-Netzanschluss</text></svg><figcaption>Abb. B4-5: Schematische Ansichten, nicht maßstäblich. HDMI ist das flache Trapez, DisplayPort hat nur eine abgeschrägte Ecke, DVI ist die breite Buchse mit Schrauben. Die ovale USB-C-Form allein sagt nichts über Tempo oder Thunderbolt; das steht nur an der Kennzeichnung. Der IEC-Netzanschluss heißt im Aufgabenheft Kaltgerätebuchse.</figcaption></figure>

528" y="196">Firewall</text><text x="16" y="234">3 Vermittlung</text><text class="t2" x="140" y="234">der Weg durch fremde Netze</text><text class="t2" x="314" y="234">IP, ICMP</text><text class="t2" x="432" y="234">IP-Adresse</text><text class="t2" x="528" y="234">Router</text><text x="16" y="272">2 Sicherung</text><text class="t2" x="140" y="272">Schritt zum Nachbargerät</text><text class="t2" x="314" y="272">Ethernet, WLAN</text><text class="t2" x="432" y="272">MAC-Adresse</text><text class="t2" x="528" y="272">Switch, AP</text><text x="16" y="310">1 Bitübertragung</text><text class="t2" x="140" y="310">Strom, Licht oder Funk</text><text class="t2" x="314" y="310">Kabel, Funk</text><text class="t2" x="432" y="310">–</text><text class="t2" x="528" y="310">Dose, Patchfeld</text><text class="ta" x="8" y="20">Unten liegt die Technik, oben das Programm</text></svg><figcaption>Abb. B5-1: Jede Zeile ist eine Schicht mit ihrer Aufgabe in Alltagsworten. Rechts daneben steht, woran du diese Schicht in einer Aufgabe erkennst.</figcaption></figure>

<figure class="abb" data-name="Abb. B5-3"><svg viewBox="0 0 640 300" role="img" aria-labelledby="b5-abb3-t"><title id="b5-abb3-t">Adressen auf den Teilstrecken vom PC zum Webserver</title><text class="mitte tb" x="320" y="24">Ein Paket auf dem Weg ins Internet</text><rect class="w" x="10" y="40" width="120" height="52"/><text class="mitte tb" x="70" y="72">PC</text><rect class="w" x="170" y="40" width="110" height="52"/><text class="mitte tb" x="225" y="72">Switch</text><rect class="w" x="330" y="40" width="110" height="52"/><text class="mitte tb" x="385" y="72">Router</text><rect class="w" x="490" y="40" width="140" height="52"/><text class="mitte tb" x="560" y="72">Webserver</text><line class="l" x1="134" y1="66" x2="166" y2="66" marker-end="url(#pfeil)"/><line class="l" x1="284" y1="66" x2="326" y2="66" marker-end="url(#pfeil)"/><line class="l" x1="444" y1="66" x2="486" y2="66" marker-end="url(#pfeil)"/><path class="d" d="M70,96 V106 H382 V96"/><path class="d" d="M388,96 V106 H560 V96"/><text class="mitte tb" x="190" y="124">Teilstrecke 1: PC bis Router</text><text class="mitte tb" x="505" y="124">Teilstrecke 2: ab Router</text><rect class="w" x="20" y="134" width="340" height="96"/><text x="32" y="158">Ziel-MAC: Router (LAN-Port)</text><text x="32" y="180">Quell-MAC: PC</text><text x="32" y="202">Ziel-IP: Webserver</text><text x="32" y="224">Quell-IP: PC</text><rect class="w" x="380" y="134" width="250" height="96"/><text x="392" y="158">Ziel-MAC: nächster Router</text><text x="392" y="180">Quell-MAC: Router (WAN)</text><text x="392" y="202">Ziel-IP: Webserver</text><text x="392" y="224">Quell-IP: PC</text><line class="a" x1="20" y1="244" x2="630" y2="244"/><text class="ta mitte" x="320" y="266">Die IP-Adressen bleiben gleich</text><text class="mitte t2" x="320" y="288">Die MAC-Adressen gelten nur für die jeweilige Teilstrecke.</text></svg><figcaption>Abb. B5-3: Über der Akzentlinie steht, was sich je Teilstrecke ändert, darunter, was gleich bleibt.</figcaption></figure>
<figure class="abb" data-name="Abb. B5-8"><svg viewBox="0 0 640 382" role="img" aria-labelledby="b5-abb8-t"><title id="b5-abb8-t">Dasselbe Paket an drei Geräten: wohin es jeweils weitergeht</title><text x="320" y="20" class="mitte t2">Ein Paket kommt an Port 1 herein. Wohin geht es weiter?</text><text x="10" y="46" class="tb">1 · Hub, Schicht 1</text><rect class="w" x="10" y="54" width="145" height="28"/><text x="82" y="72" class="mitte t2">Port 1</text><rect class="w" x="165" y="54" width="145" height="28"/><text x="237" y="72" class="mitte t2">Port 2</text><rect class="w" x="320" y="54" width="145" height="28"/><text x="392" y="72" class="mitte t2">Port 3 · Ziel im Netz</text><rect class="w" x="475" y="54" width="145" height="28"/><text x="547" y="72" class="mitte t2">Port 4 · anderes Netz</text><rect class="f" x="10" y="88" width="145" height="22"/><text x="82" y="104" class="mitte t2">kommt herein</text><rect class="f" x="165" y="88" width="145" height="22"/><text x="237" y="104" class="mitte t2">Kopie</text><rect class="f" x="320" y="88" width="145" height="22"/><text x="392" y="104" class="mitte t2">Kopie</text><rect class="f" x="475" y="88" width="145" height="22"/><text x="547" y="104" class="mitte t2">Kopie</text><rect class="a" x="165" y="88" width="145" height="22"/><rect class="a" x="475" y="88" width="145" height="22"/><text x="10" y="130" class="t2">Der Hub kennt kein Ziel und schickt an alle anderen Ports – auch dahin, wo es niemanden angeht.</text><text x="10" y="162" class="tb">2 · Switch, Schicht 2</text><rect class="w" x="10" y="170" width="145" height="28"/><text x="82" y="188" class="mitte t2">Port 1</text><rect class="w" x="165" y="170" width="145" height="28"/><text x="237" y="188" class="mitte t2">Port 2</text><rect class="w" x="320" y="170" width="145" height="28"/><text x="392" y="188" class="mitte t2">Port 3 · Ziel im Netz</text><rect class="w" x="475" y="170" width="145" height="28"/><text x="547" y="188" class="mitte t2">Port 4 · anderes Netz</text><rect class="f" x="10" y="204" width="145" height="22"/><text x="82" y="220" class="mitte t2">kommt herein</text><rect class="d" x="165" y="204" width="145" height="22"/><rect class="f" x="320" y="204" width="145" height="22"/><text x="392" y="220" class="mitte t2">geht hier hinaus</text><rect class="d" x="475" y="204" width="145" height="22"/><text x="10" y="246" class="t2">Der Switch hat gelernt, an welchem Port die Ziel-MAC sitzt, und schickt nur dorthin.</text><text x="10" y="278" class="tb">3 · Router, Schicht 3</text><rect class="w" x="10" y="286" width="145" height="28"/><text x="82" y="304" class="mitte t2">Port 1</text><rect class="w" x="165" y="286" width="145" height="28"/><text x="237" y="304" class="mitte t2">Port 2</text><rect class="w" x="320" y="286" width="145" height="28"/><text x="392" y="304" class="mitte t2">Port 3 · Ziel im Netz</text><rect class="w" x="475" y="286" width="145" height="28"/><text x="547" y="304" class="mitte t2">Port 4 · anderes Netz</text><rect class="f" x="10" y="320" width="145" height="22"/><text x="82" y="336" class="mitte t2">kommt herein</text><rect class="d" x="165" y="320" width="145" height="22"/><rect class="d" x="320" y="320" width="145" height="22"/><rect class="f" x="475" y="320" width="145" height="22"/><text x="547" y="336" class="mitte t2">geht hier hinaus</text><text x="10" y="362" class="t2">Der Router schickt nur weiter, was in ein anderes Netz gehört, mit neuen MAC-Adressen.</text></svg><figcaption>Abb. B5-8: Drei Geräte, je ein Paket an Port 1. Beim Hub und Switch sitzt das Ziel im eigenen Netz (Port 3), beim Router in einem anderen Netz (Port 4). Der Akzent zeigt, was der Hub zu viel tut.</figcaption></figure>
<figure class="abb" data-name="Abb. B5-4"><svg viewBox="0 0 640 282" role="img" aria-labelledby="b5-abb4-t"><title id="b5-abb4-t">TCP mit Verbindungsaufbau und Quittung gegenüber UDP</title><text class="mitte tb" x="160" y="24">TCP: mit Verbindung und Quittung</text><text class="mitte tb" x="480" y="24">UDP: ohne Verbindungsaufbau</text><line class="g" x1="320" y1="14" x2="320" y2="272"/><text class="mitte tb" x="60" y="48">Client</text><text class="mitte tb" x="250" y="48">Server</text><line class="l" x1="60" y1="58" x2="60" y2="232"/><line class="l" x1="250" y1="58" x2="250" y2="232"/><line class="l" x1="62" y1="82" x2="246" y2="82" marker-end="url(#pfeil)"/><text class="mitte t2" x="154" y="74">SYN</text><line class="l" x1="248" y1="112" x2="64" y2="112" marker-end="url(#pfeil)"/><text class="mitte t2" x="154" y="104">SYN, ACK</text><line class="l" x1="62" y1="142" x2="246" y2="142" marker-end="url(#pfeil)"/><text class="mitte t2" x="154" y="134">ACK</text><line class="l" x1="62" y1="180" x2="246" y2="180" marker-end="url(#pfeil)"/><text class="mitte t2" x="154" y="172">Daten</text><line class="a" x1="248" y1="212" x2="64" y2="212" marker-end="url(#pfeil-a)"/><text class="ta mitte" x="154" y="204">Quittung</text><text class="mitte t2" x="160" y="254">Fehlt die Quittung, wird erneut gesendet.</text><text class="mitte tb" x="380" y="48">Sender</text><text class="mitte tb" x="570" y="48">Empfänger</text><line class="l" x1="380" y1="58" x2="380" y2="232"/><line class="l" x1="570" y1="58" x2="570" y2="232"/><line class="l" x1="382" y1="92" x2="566" y2="92" marker-end="url(#pfeil)"/><text class="mitte t2" x="474" y="84">Datagramm 1</text><line class="l" x1="382" y1="142" x2="566" y2="142" marker-end="url(#pfeil)"/><text class="mitte t2" x="474" y="134">Datagramm 2</text><line class="l" x1="382" y1="192" x2="566" y2="192" marker-end="url(#pfeil)"/><text class="mitte t2" x="474" y="184">Datagramm 3</text><text class="mitte t2" x="480" y="254">Kein Aufbau, keine Quittung, kein erneutes Senden.</text></svg><figcaption>Abb. B5-4: Der Unterschied hängt an der Quittung im Akzent. Sie kostet Zeit und bringt Zuverlässigkeit.</figcaption></figure>
<figure class="abb" data-name="Abb. B5-5"><svg viewBox="0 0 640 290" role="img" aria-labelledby="b5-abb5-t"><title id="b5-abb5-t">Weg von der Arbeitsplatzdose über das Patchfeld zum Switch</title><text class="mitte tb" x="84" y="40">Dose 5/6 im Raum</text><rect class="w" x="14" y="60" width="140" height="90"/><rect class="w" x="34" y="82" width="44" height="44"/><text class="mitte" x="56" y="110">5</text><rect class="w" x="90" y="82" width="44" height="44"/><text class="mitte" x="112" y="110">6</text><line class="l" x1="158" y1="105" x2="212" y2="105" marker-end="url(#pfeil)"/><text class="mitte t2" x="185" y="95">fest verlegt</text><text class="mitte tb" x="320" y="40">Patchfeld im Rack</text><rect class="w" x="220" y="60" width="200" height="90"/><rect class="w" x="232" y="82" width="26" height="44"/><text class="mitte" x="245" y="110">1</text><rect class="w" x="262" y="82" width="26" height="44"/><text class="mitte" x="275" y="110">2</text><rect class="w" x="292" y="82" width="26" height="44"/><text class="mitte" x="305" y="110">3</text><rect class="w" x="322" y="82" width="26" height="44"/><text class="mitte" x="335" y="110">4</text><rect class="f" x="352" y="82" width="26" height="44"/><text class="mitte" x="365" y="110">5</text><rect class="w" x="382" y="82" width="26" height="44"/><text class="mitte" x="395" y="110">6</text><text class="mitte tb" x="535" y="40">Switch</text><rect class="w" x="440" y="60" width="190" height="90"/><rect class="w" x="452" y="96" width="24" height="34"/><rect class="w" x="480" y="96" width="24" height="34"/><rect class="w" x="508" y="96" width="24" height="34"/><rect class="w" x="536" y="96" width="24" height="34"/><rect class="w" x="564" y="96" width="24" height="34"/><rect class="w" x="592" y="96" width="24" height="34"/><path class="a" d="M365,130 V184 H492 V154" marker-end="url(#pfeil-a)"/><text class="ta mitte" x="428" y="204">Patchkabel</text><text class="mitte" x="320" y="240">Erst das Patchkabel verbindet die Dose mit dem Switch.</text><text class="mitte t2" x="320" y="266">Ein nicht gepatchter Port bleibt ohne Verbindung.</text></svg><figcaption>Abb. B5-5: Nur Port 5 ist auf den Switch gesteckt. Wer diese Kette kennt, findet die tote Dose ohne Messgerät.</figcaption></figure>
<figure class="abb" data-name="Abb. B5-6"><svg viewBox="0 0 640 198" role="img" aria-labelledby="b5-abb6-t"><title id="b5-abb6-t">Vier Befehle für die Netzdiagnose</title><rect class="w" x="20" y="20" width="292" height="73"/><text x="34" y="45" class="ta">1</text><text x="54" y="45" class="tb">ping</text><text x="54" y="66" class="t2">Erreichbarkeit, Laufzeit und Verluste</text><rect class="w" x="328" y="20" width="292" height="73"/><text x="342" y="45" class="ta">2</text><text x="362" y="45" class="tb">tracert</text><text x="362" y="66" class="t2">die Router auf dem Weg zum Ziel</text><rect class="w" x="20" y="105" width="292" height="73"/><text x="34" y="130" class="ta">3</text><text x="54" y="130" class="tb">nslookup</text><text x="54" y="151" class="t2">fragt den DNS-Server nach einem Namen</text><rect class="w" x="328" y="105" width="292" height="73"/><text x="342" y="130" class="ta">4</text><text x="362" y="130" class="tb">ipconfig</text><text x="362" y="151" class="t2">die eigene Konfiguration, mit /all</text><text x="362" y="166" class="t2">auch MAC und DHCP</text></svg><figcaption>Abb. B5-6: nslookup trennt eine Namensstörung von einer Verbindungsstörung. Diese vier Befehle decken den größten Teil der Prüfungsfragen ab.</figcaption></figure>
<figure class="abb" data-name="Abb. B5-7"><svg viewBox="0 0 640 340" role="img" aria-labelledby="b5-abb7-t"><title id="b5-abb7-t">Verantwortung von Kunde und Anbieter bei IaaS, PaaS und SaaS</title><rect class="w" x="8" y="10" width="624" height="288"/><rect class="f" x="176" y="210" width="152" height="88"/><rect class="f" x="328" y="122" width="152" height="176"/><rect class="f" x="480" y="78" width="152" height="220"/><line class="g" x1="8" y1="34" x2="632" y2="34"/><line class="g" x1="8" y1="78" x2="632" y2="78"/><line class="g" x1="8" y1="122" x2="632" y2="122"/><line class="g" x1="8" y1="166" x2="632" y2="166"/><line class="g" x1="8" y1="210" x2="632" y2="210"/><line class="g" x1="8" y1="254" x2="632" y2="254"/><line class="g" x1="176" y1="10" x2="176" y2="298"/><line class="g" x1="328" y1="10" x2="328" y2="298"/><line class="g" x1="480" y1="10" x2="480" y2="298"/><text class="tb" x="16" y="28">Ebene</text><text class="mitte tb" x="252" y="28">IaaS</text><text class="mitte tb" x="404" y="28">PaaS</text><text class="mitte tb" x="556" y="28">SaaS</text><text x="16" y="61">Daten</text><text x="16" y="105">Anwendung</text><text x="16" y="149">Laufzeitumgebung</text><text x="16" y="193">Betriebssystem</text><text x="16" y="237">Virtualisierung</text><text x="16" y="281">Hardware und Netz</text><text class="mitte" x="252" y="127">Kunde</text><text class="mitte" x="252" y="259">Anbieter</text><text class="mitte" x="404" y="83">Kunde</text><text class="mitte" x="404" y="215">Anbieter</text><text class="mitte" x="556" y="61">Kunde</text><text class="mitte" x="556" y="193">Anbieter</text><path class="a" d="M176,210 H328 V122 H480 V78 H632" marker-end="url(#pfeil-a)"/><text class="ta mitte" x="320" y="322">Über der Linie betreibt der Kunde, darunter der Anbieter.</text></svg><figcaption>Abb. B5-7: Die Akzentlinie ist die Verantwortungsgrenze. Jede Stufe nach oben nimmt Betriebsaufwand ab und erhöht die Abhängigkeit.</figcaption></figure>
<figure class="abb" data-name="Abb. B6-1"><svg viewBox="0 0 640 290" role="img" aria-labelledby="b6-abb1-t"><title id="b6-abb1-t">Schichten zwischen Hardware und Anwendung</title><rect class="f" x="170" y="36" width="300" height="46"/><text class="mitte tb" x="320" y="64">Anwendungssoftware</text><text class="t2" x="482" y="64">Textverarbeitung, Browser</text><rect class="w" x="170" y="90" width="300" height="46"/><text class="mitte tb" x="320" y="118">Betriebssystem</text><text class="t2" x="482" y="118">Prozesse, Speicher, Rechte</text><rect class="w" x="170" y="144" width="300" height="46"/><text class="mitte tb" x="320" y="172">Firmware (UEFI) und Treiber</text><text class="t2" x="482" y="172">Startet und steuert Geräte</text><rect class="f" x="170" y="198" width="300" height="46"/><text class="mitte tb" x="320" y="226">Hardware</text><text class="t2" x="482" y="226">CPU, RAM, Datenträger</text><line class="a" x1="120" y1="44" x2="120" y2="234" marker-end="url(#pfeil-a)"/><text class="mitte ta" x="60" y="108">Auftrag</text><text class="mitte ta" x="60" y="128">geht nach</text><text class="mitte ta" x="60" y="148">unten durch</text><text class="mitte t2" x="320" y="272">Jede Schicht nutzt die Dienste der Schicht direkt darunter.</text></svg><figcaption>Abb. B6-1: Ein Druckauftrag wandert von der Anwendung über Betriebssystem und Treiber bis zur Hardware. Fällt eine Schicht aus, suchst du in der Schicht darunter.</figcaption></figure>
<figure class="abb" data-name="Abb. B6-2"><svg viewBox="0 0 640 283" role="img" aria-labelledby="b6-abb2-t"><title id="b6-abb2-t">Fünf Verwaltungsaufgaben eines Betriebssystems</title><rect class="w" x="20" y="20" width="292" height="73"/><text x="34" y="45" class="ta">1</text><text x="54" y="45" class="tb">Prozessverwaltung</text><text x="54" y="66" class="t2">teilt Rechenzeit zu, startet,</text><text x="54" y="81" class="t2">unterbricht, beendet</text><rect class="w" x="328" y="20" width="292" height="73"/><text x="342" y="45" class="ta">2</text><text x="362" y="45" class="tb">Speicherverwaltung</text><text x="362" y="66" class="t2">weist Arbeitsspeicher zu, trennt die</text><text x="362" y="81" class="t2">Adressräume</text><rect class="w" x="20" y="105" width="292" height="73"/><text x="34" y="130" class="ta">3</text><text x="54" y="130" class="tb">Geräteverwaltung</text><text x="54" y="151" class="t2">spricht Hardware über Treiber an</text><rect class="w" x="328" y="105" width="292" height="73"/><text x="342" y="130" class="ta">4</text><text x="362" y="130" class="tb">Dateiverwaltung</text><text x="362" y="151" class="t2">legt Daten in Dateien und</text><text x="362" y="166" class="t2">Verzeichnissen ab</text><rect class="w" x="20" y="190" width="292" height="73"/><text x="34" y="215" class="ta">5</text><text x="54" y="215" class="tb">Benutzerverwaltung</text><text x="54" y="236" class="t2">unterscheidet Konten und Rechte</text></svg><figcaption>Abb. B6-2: Diese fünf Aufgaben decken ab, was Prüfungen dazu abfragen.</figcaption></figure>
<figure class="abb" data-name="Abb. B6-3"><svg viewBox="0 0 640 238" role="img" aria-labelledby="b6-abb3-t"><title id="b6-abb3-t">Drei Wege, wenn eine Funktion fehlt</title><rect class="w" x="20" y="20" width="600" height="58"/><text x="34" y="45" class="ta">1</text><text x="54" y="45" class="tb">Standardsoftware kaufen</text><text x="54" y="66" class="t2">Verfügbarkeit, Preis, Erprobung</text><rect class="w" x="20" y="90" width="600" height="58"/><text x="34" y="115" class="ta">2</text><text x="54" y="115" class="tb">Selbst entwickeln</text><text x="54" y="136" class="t2">Passung und Unabhängigkeit</text><rect class="w" x="20" y="160" width="600" height="58"/><text x="34" y="185" class="ta">3</text><text x="54" y="185" class="tb">Entwicklung fremdvergeben</text><text x="54" y="206" class="t2">siehe die Gegenargumente darunter</text></svg><figcaption>Abb. B6-3: Wahl der Programmiersprache sowie Compiler und Interpreter stehen in A7.</figcaption></figure>
<figure class="abb" data-name="Abb. B6-4"><svg viewBox="0 0 640 350" role="img" aria-labelledby="b6-abb4-t"><title id="b6-abb4-t">Lizenz-Landkarte aus Quellcode und Preis</title><text class="mitte tb" x="245" y="46">Quellcode offen</text><text class="mitte tb" x="495" y="46">Quellcode geschlossen</text><rect class="w" x="120" y="60" width="500" height="240"/><line class="l" x1="370" y1="60" x2="370" y2="300"/><line class="l" x1="120" y1="180" x2="620" y2="180"/><text class="rechts tb" x="110" y="125">kostenlos</text><text class="rechts tb" x="110" y="245">kostenpflichtig</text><rect class="a" x="120" y="180" width="250" height="120"/><text class="mitte" x="245" y="112">Open-Source-Software</text><text class="mitte t2" x="245" y="140">Beispiel: Linux, freies Büropaket</text><text class="mitte" x="495" y="112">Freeware</text><text class="mitte t2" x="495" y="140">Beispiel: kostenloser PDF-Betrachter</text><text class="mitte ta" x="245" y="232">Open Source mit Kaufpreis</text><text class="mitte t2" x="245" y="260">Beispiel: Distribution mit Support-Abo</text><text class="mitte" x="495" y="232">Proprietär, gekauft oder Abo</text><text class="mitte t2" x="495" y="260">Beispiel: Bürosoftware im Abonnement</text><text class="mitte t2" x="320" y="330">Der Preis steht auf der einen Achse, der offene Quellcode auf der anderen.</text></svg><figcaption>Abb. B6-4: Das hervorgehobene Feld beweist, dass Open Source und kostenlos zwei verschiedene Aussagen sind. Ein Unternehmen zahlt dort für Pflege und Support, nicht für das Programm.</figcaption></figure>
<figure class="abb" data-name="Abb. B6-5"><svg viewBox="0 0 640 179" role="img" aria-labelledby="b6-abb5-t"><title id="b6-abb5-t">Zwei Familien innerhalb von Open Source</title><rect class="f" x="192" y="20" width="208" height="29"/><text x="296" y="42" class="tb mitte">Copyleft</text><rect class="f" x="412" y="20" width="208" height="29"/><text x="516" y="42" class="tb mitte">Permissiv</text><text x="20" y="78" class="t2 tb">Beispiel</text><rect class="w" x="192" y="57" width="208" height="31"/><text x="296" y="79" class="mitte">GNU GPL Version 3</text><rect class="w" x="412" y="57" width="208" height="31"/><text x="516" y="79" class="mitte">MIT-Lizenz</text><text x="20" y="117" class="t2 tb">Bedingung bei</text><text x="20" y="133" class="t2 tb">Weitergabe</text><rect class="w" x="192" y="96" width="208" height="65"/><text x="296" y="118" class="mitte">bearbeitete Fassung unter</text><text x="296" y="135" class="mitte">derselben Lizenz</text><rect class="w" x="412" y="96" width="208" height="65"/><text x="516" y="118" class="mitte">Lizenzhinweis erhalten,</text><text x="516" y="135" class="mitte">auch in geschlossenen</text><text x="516" y="152" class="mitte">Produkten</text></svg><figcaption>Abb. B6-5: Jedes Programm bleibt ein urheberrechtlich geschütztes Werk. Die Lizenz gibt Rechte, sie hebt den Schutz nicht auf.</figcaption></figure>
<figure class="abb" data-name="Abb. B6-6"><svg viewBox="0 0 640 310" role="img" aria-labelledby="b6-abb6-t"><title id="b6-abb6-t">Weg einer Anfrage bei statischer und dynamischer Website</title><text class="mitte tb" x="320" y="20">Statisch: die Seite liegt fertig auf dem Server</text><rect class="w" x="20" y="34" width="140" height="44"/><text class="mitte" x="90" y="61">Browser</text><line class="l" x1="164" y1="56" x2="204" y2="56" marker-end="url(#pfeil)"/><rect class="w" x="210" y="34" width="160" height="44"/><text class="mitte" x="290" y="61">Webserver</text><line class="l" x1="374" y1="56" x2="414" y2="56" marker-end="url(#pfeil)"/><rect class="w" x="420" y="34" width="200" height="44"/><text class="mitte" x="520" y="61">Fertige HTML-Datei</text><text class="mitte t2" x="320" y="100">Inhalt ändern heißt: Datei bearbeiten und neu hochladen.</text><line class="g" x1="20" y1="124" x2="620" y2="124"/><text class="mitte tb" x="320" y="152">Dynamisch: die Seite entsteht bei jeder Anfrage neu</text><rect class="a" x="336" y="166" width="296" height="72"/><rect class="w" x="28" y="176" width="125" height="44"/><text class="mitte" x="90" y="203">Browser</text><line class="l" x1="157" y1="198" x2="181" y2="198" marker-end="url(#pfeil)"/><rect class="w" x="185" y="176" width="125" height="44"/><text class="mitte" x="247" y="203">Webserver</text><line class="l" x1="314" y1="198" x2="334" y2="198" marker-end="url(#pfeil)"/><rect class="w" x="342" y="176" width="125" height="44"/><text class="mitte" x="404" y="203">Anwendung</text><line class="l" x1="471" y1="198" x2="495" y2="198" marker-end="url(#pfeil)"/><rect class="w" x="499" y="176" width="125" height="44"/><text class="mitte" x="561" y="203">Datenbank</text><text class="mitte ta" x="484" y="258">Hier entsteht der Inhalt bei jeder Anfrage</text><line class="l" x1="600" y1="282" x2="90" y2="282" marker-end="url(#pfeil)"/><text class="mitte t2" x="320" y="302">Antwort in beiden Fällen: fertiges HTML an den Browser</text></svg><figcaption>Abb. B6-6: Der Umweg über Anwendung und Datenbank ist der ganze Unterschied. Eine statische Seite geht ihn nicht und zeigt ohne Bearbeitung der Datei nichts Neues.</figcaption></figure>
<figure class="abb" data-name="Abb. B6-7"><svg viewBox="0 0 640 198" role="img" aria-labelledby="b6-abb7-t"><title id="b6-abb7-t">Wer im Web welche Aufgabe hat</title><rect class="w" x="20" y="20" width="292" height="73"/><text x="34" y="45" class="ta">1</text><text x="54" y="45" class="tb">HTML</text><text x="54" y="66" class="t2">die Struktur</text><rect class="w" x="328" y="20" width="292" height="73"/><text x="342" y="45" class="ta">2</text><text x="362" y="45" class="tb">CSS</text><text x="362" y="66" class="t2">die Gestaltung</text><rect class="w" x="20" y="105" width="292" height="73"/><text x="34" y="130" class="ta">3</text><text x="54" y="130" class="tb">JavaScript</text><text x="54" y="151" class="t2">das Verhalten</text><rect class="w" x="328" y="105" width="292" height="73"/><text x="342" y="130" class="ta">4</text><text x="362" y="130" class="tb">Backend</text><text x="362" y="151" class="t2">Programmcode liest, prüft und schreibt</text><text x="362" y="166" class="t2">Daten</text></svg><figcaption>Abb. B6-7: Ein Content-Management-System stellt eine fertige dynamische Anwendung bereit; wer es einsetzt, betreibt eine dynamische Website, auch ohne selbst Code zu schreiben.</figcaption></figure>

" height="42"/><rect class="w" x="450" y="176" width="85" height="42"/><rect class="w" x="538" y="176" width="85" height="42"/><text x="52" y="202" class="mitte">500 GB</text><text x="140" y="202" class="mitte">20 GB</text><text x="228" y="202" class="mitte">40 GB</text><text x="316" y="202" class="mitte">60 GB</text><text x="404" y="202" class="mitte">80 GB</text><text x="492" y="202" class="mitte">100 GB</text><text x="580" y="202" class="mitte">120 GB</text><rect class="a" x="10" y="176" width="85" height="42"/><rect class="a" x="362" y="176" width="85" height="42"/><text x="10" y="238" class="ta">Stand Donnerstag: 2 Sicherungen</text><text x="630" y="238" class="rechts t2">Woche gesamt 920 GB</text><text x="10" y="270">inkrementell – seit der letzten Sicherung</text><rect class="f" x="10" y="278" width="85" height="42"/><rect class="w" x="98" y="278" width="85" height="42"/><rect class="w" x="186" y="278" width="85" height="42"/><rect class="w" x="274" y="278" width="85" height="42"/><rect class="w" x="362" y="278" width="85" height="42"/><rect class="w" x="450" y="278" width="85" height="42"/><rect class="w" x="538" y="278" width="85" height="42"/><text x="52" y="304" class="mitte">500 GB</text><text x="140" y="304" class="mitte">20 GB</text><text x="228" y="304" class="mitte">20 GB</text><text x="316" y="304" class="mitte">20 GB</text><text x="404" y="304" class="mitte">20 GB</text><text x="492" y="304" class="mitte">20 GB</text><text x="580" y="304" class="mitte">20 GB</text><rect class="a" x="10" y="278" width="85" height="42"/><rect class="a" x="98" y="278" width="85" height="42"/><rect class="a" x="186" y="278" width="85" height="42"/><rect class="a" x="274" y="278" width="85" height="42"/><rect class="a" x="362" y="278" width="85" height="42"/><text x="10" y="340" class="ta">Stand Donnerstag: 5 Sicherungen</text><text x="630" y="340" class="rechts t2">Woche gesamt 620 GB</text></svg><figcaption>Abb. B7-1: Eine Woche, drei Antworten. Der Akzent zeigt, welc
