<figure class="abb" data-name="Abb. B7-4"><svg viewBox="0 0 640 244" role="img" aria-labelledby="b7-abb4-t"><title id="b7-abb4-t">Die drei Grundideen von RAID: Streifen, Spiegel, Streifen mit Prüfsumme</title>
<text x="110" y="24" class="tb mitte">RAID 0 · Streifen</text>
<rect class="w" x="20" y="40" width="80" height="80"/><text x="60" y="60" class="t2 mitte">Platte 1</text><text x="60" y="84" class="mono mitte">A1</text><text x="60" y="106" class="mono mitte">A3</text>
<rect class="w" x="120" y="40" width="80" height="80"/><text x="160" y="60" class="t2 mitte">Platte 2</text><text x="160" y="84" class="mono mitte">A2</text><text x="160" y="106" class="mono mitte">A4</text>
<text x="110" y="146" class="t2 mitte">Datei A in Stücke, abwechselnd verteilt</text>
<text x="110" y="166" class="t2 mitte">schnell, Platz aller Platten</text>
<text x="110" y="190" class="ta mitte">eine Platte kaputt: alles weg</text>
<text x="320" y="24" class="tb mitte">RAID 1 · Spiegel</text>
<rect class="w" x="230" y="40" width="80" height="80"/><text x="270" y="60" class="t2 mitte">Platte 1</text><text x="270" y="84" class="mono mitte">A1</text><text x="270" y="106" class="mono mitte">A2</text>
<rect class="w" x="330" y="40" width="80" height="80"/><text x="370" y="60" class="t2 mitte">Platte 2</text><text x="370" y="84" class="mono mitte">A1</text><text x="370" y="106" class="mono mitte">A2</text>
<text x="320" y="146" class="t2 mitte">alles doppelt geschrieben</text>
<text x="320" y="166" class="t2 mitte">Platz einer Platte</text>
<text x="320" y="190" class="ta mitte">eine darf ausfallen</text>
<text x="530" y="24" class="tb mitte">RAID 5 · Streifen + Prüfsumme</text>
<rect class="w" x="440" y="40" width="54" height="80"/><text x="467" y="60" class="t2 mitte">Platte 1</text><text x="467" y="90" class="mono mitte">A1</text>
<rect class="w" x="503" y="40" width="54" height="80"/><text x="530" y="60" class="t2 mitte">Platte 2</text><text x="530" y="90" class="mono mitte">A2</text>
<rect class="w" x="566" y="40" width="54" height="80"/><rect class="a" x="566" y="40" width="54" height="80"/><text x="593" y="60" class="t2 mitte">Platte 3</text><text x="593" y="90" class="mono mitte">P</text>
<text x="530" y="146" class="t2 mitte">Stücke plus Prüfsumme P</text>
<text x="530" y="166" class="t2 mitte">Platz aller Platten außer einer</text>
<text x="530" y="190" class="ta mitte">eine darf ausfallen, P rechnet nach</text>
<text x="320" y="216" class="t2 mitte">Fällt Platte 1 aus, gilt: A1 = P minus A2.</text>

<figure class="abb" data-name="Abb. B7-5"><svg viewBox="0 0 640 352" role="img" aria-labelledby="b7-abb5-t"><title id="b7-abb5-t">Nutzkapazität bei RAID 1 und RAID 5</title><text x="10" y="24" class="tb">RAID 1 · zwei Platten zu je 4 TB</text><rect class="w" x="10" y="36" width="150" height="64"/><text x="85" y="60" class="mitte">Platte 1</text><text x="85" y="82" class="mitte mono">A B C</text><rect class="w" x="250" y="36" width="150" height="64"/><text x="325" y="60" class="mitte">Platte 2</text><text x="325" y="82" class="mitte mono">A B C</text><line class="l" x1="168" y1="68" x2="242" y2="68" marker-end="url(#pfeil)"/><text x="205" y="112" class="mitte t2">Spiegel</text><text x="420" y="56">Nutzkapazität</text><text x="420" y="78" class="mono">1 × 4 TB = 4 TB</text><text x="420" y="98" class="t2">50 % von 8 TB brutto</text><line class="g" x1="10" y1="124" x2="630" y2="124"/><text x="10" y="150" class="tb">RAID 5 · vier Platten zu je 4 TB</text><text x="70" y="176" class="mitte t2">Platte 1</text><text x="180" y="176" class="mitte t2">Platte 2</text><text x="290" y="176" class="mitte t2">Platte 3</text><text x="400" y="176" class="mitte t2">Platte 4</text><rect class="w" x="20" y="186" width="100" height="34"/><rect class="w" x="130" y="186" width="100" height="34"/><rect class="w" x="240" y="186" width="100" height="34"/><rect class="w" x="350" y="186" width="100" height="34"/><text x="70" y="208" class="mitte mono">A1</text><text x="180" y="208" class="mitte mono">A2</text><text x="290" y="208" class="mitte mono">A3</text><text x="400" y="208" class="mitte mono">Parität A</text><rect class="w" x="20" y="224" width="100" height="34"/><rect class="w" x="130" y="224" width="100" height="34"/><rect class="w" x="240" y="224" width="100" height="34"/><rect class="w" x="350" y="224" width="100" height="34"/><text x="70" y="246" class="mitte mono">B1</text><text x="180" y="246" class="mitte mono">B2</text><text x="290" y="246" class="mitte mono">Parität B</text><text x="400" y="246" class="mitte mono">B3</text><rect class="w" x="20" y="262" width="100" height="34"/><rect class="w" x="130" y="262" width="100" height="34"/><rect class="w" x="240" y="262" width="100" height="34"/><rect class="w" x="350" y="262" width="100" height="34"/><text x="70" y="284" class="mitte mono">C1</text><text x="180" y="284" class="mitte mono">Parität C</text><text x="290" y="284" class="mitte mono">C2</text><text x="400" y="284" class="mitte mono">C3</text><rect class="a" x="350" y="186" width="100" height="34"/><rect class="a" x="240" y="224" width="100" height="34"/><rect class="a" x="130" y="262" width="100" height="34"/><text x="470" y="214">Nutzkapazität</text><text x="470" y="236" class="mono">(4 − 1) × 4 TB</text><text x="470" y="258" class="mono">= 12 TB</text><text x="470" y="280" class="t2">75 % von 16 TB</text><text x="20" y="322" class="ta">Die Parität liegt in jedem Streifen auf einer anderen Platte.</text><text x="20" y="344" class="t2">Deshalb kostet RAID 5 genau eine Plattenkapazität, gleich welche Platte ausfällt.</text></svg><figcaption>Abb. B7-5: Oben der Spiegel mit zwei Platten, unten RAID 5 mit vier. Der Akzent folgt der Prüfsumme von Streifen zu Streifen, sie wandert über alle Platten.</figcaption></figure>
<figure class="abb" data-name="Abb. B7-6"><svg viewBox="0 0 640 201" role="img" aria-labelledby="b7-abb6-t"><title id="b7-abb6-t">Nutzkapazität und erlaubter Ausfall der RAID-Stufen</title><rect class="f" x="142" y="20" width="110.5" height="29"/><text x="197.2" y="42" class="tb mitte">RAID 0</text><rect class="f" x="264.5" y="20" width="110.5" height="29"/><text x="319.8" y="42" class="tb mitte">RAID 1</text><rect class="a" x="387" y="20" width="110.5" height="29"/><text x="442.2" y="42" class="tb mitte">RAID 5</text><rect class="f" x="509.5" y="20" width="110.5" height="29"/><text x="564.8" y="42" class="tb mitte">RAID 10</text><text x="20" y="78" class="t2 tb">Nutzkapazität</text><rect class="w" x="142" y="57" width="110.5" height="31"/><text x="197.2" y="79" class="mitte">n × K</text><rect class="w" x="264.5" y="57" width="110.5" height="31"/><text x="319.8" y="79" class="mitte">(n / 2) × K</text><rect class="w" x="387" y="57" width="110.5" height="31"/><text x="442.2" y="79" class="mitte">(n − 1) × K</text><rect class="w" x="509.5" y="57" width="110.5" height="31"/><text x="564.8" y="79" class="mitte">(n / 2) × K</text><text x="20" y="117" class="t2 tb">Bei 8 Platten</text><text x="20" y="133" class="t2 tb">zu 4 TB</text><rect class="w" x="142" y="96" width="110.5" height="48"/><text x="197.2" y="118" class="mitte">32 TB</text><rect class="w" x="264.5" y="96" width="110.5" height="48"/><text x="319.8" y="118" class="mitte">16 TB</text><rect class="w" x="387" y="96" width="110.5" height="48"/><text x="442.2" y="118" class="mitte">28 TB</text><rect class="w" x="509.5" y="96" width="110.5" height="48"/><text x="564.8" y="118" class="mitte">16 TB</text><text x="20" y="173" class="t2 tb">Ausfall erlaubt</text><rect class="w" x="142" y="152" width="110.5" height="31"/><text x="197.2" y="174" class="mitte">keiner</text><rect class="w" x="264.5" y="152" width="110.5" height="31"/><text x="319.8" y="174" class="mitte">1 je Paar</text><rect class="w" x="387" y="152" width="110.5" height="31"/><text x="442.2" y="174" class="mitte">1 Platte</text><rect class="w" x="509.5" y="152" width="110.5" height="31"/><text x="564.8" y="174" class="mitte">1 je Spiegel</text></svg><figcaption>Abb. B7-6: Die vier Stufen nebeneinander, gerechnet mit acht Platten zu 4 TB. n ist die Anzahl der Platten, K die Kapazität der kleinsten Platte. RAID 1 und RAID 10 sind hier gleich groß.</figcaption></figure>
<figure class="abb" data-name="Abb. B7-7"><svg viewBox="0 0 640 116" role="img" aria-labelledby="b7-abb7-t"><title id="b7-abb7-t">Von der Prozentzusage zur Ausfallzeit</title><rect class="w" x="20" y="36" width="166.7" height="60"/><text x="103.3" y="56" class="t2 mitte">Verfügbarkeit</text><text x="103.3" y="86" class="tb mitte">99,9 %</text><line class="l" x1="192.7" y1="66" x2="228.7" y2="66" marker-end="url(#pfeil)"/><text x="214.7" y="25" class="t2 mitte">1 − 0,999 = 0,001</text><rect class="w" x="236.7" y="36" width="166.7" height="60"/><text x="320" y="56" class="t2 mitte">Anteil vom Jahr</text><text x="320" y="86" class="tb mitte">0,001 × 8.760 h</text><line class="l" x1="409.3" y1="66" x2="445.3" y2="66" marker-end="url(#pfeil)"/><text x="431.3" y="25" class="t2 mitte">ergibt</text><rect class="a" x="453.3" y="36" width="166.7" height="60"/><text x="536.7" y="56" class="t2 mitte">Ausfallzeit je Jahr</text><text x="536.7" y="86" class="tb mitte">8,76 h</text></svg><figcaption>Abb. B7-7: Von der Prozentzahl zur Ausfallzeit in drei Schritten. Ein Jahr hat 8.760 Stunden. Aus MTBF und Reparaturdauer folgt A = MTBF / (MTBF + MTTR).</figcaption></figure>
<figure class="abb" data-name="Abb. B8-1"><svg viewBox="0 0 640 400" role="img" aria-labelledby="b8-abb1-t"><title id="b8-abb1-t">Bildschirmarbeitsplatz in Seitenansicht mit Maßen</title><rect class="f" x="40" y="30" width="80" height="10"/><line class="l" x1="60" y1="42" x2="52" y2="62"/><line class="l" x1="80" y1="42" x2="80" y2="64"/><line class="l" x1="100" y1="42" x2="108" y2="62"/><text class="t2" x="30" y="22">Beleuchtungsstärke 500 lx</text><line class="g" x1="178" y1="116" x2="178" y2="74"/><line class="g" x1="424" y1="141" x2="424" y2="74"/><line class="l" x1="298" y1="74" x2="182" y2="74" marker-end="url(#pfeil)"/><line class="l" x1="298" y1="74" x2="420" y2="74" marker-end="url(#pfeil)"/><text class="mitte" x="298" y="62">Sehabstand 50 bis 70 cm</text><circle class="w" cx="150" cy="118" r="24"/><line class="l" x1="150" y1="142" x2="146" y2="168"/><line class="l" x1="146" y1="168" x2="118" y2="272"/><line class="l" x1="146" y1="168" x2="152" y2="230"/><line class="l" x1="152" y1="230" x2="200" y2="230"/><line class="l" x1="118" y1="272" x2="188" y2="272"/><line class="l" x1="188" y1="272" x2="188" y2="344"/><line class="l" x1="188" y1="344" x2="212" y2="344"/><path class="g" d="M152,206 A24,24 0 0 0 176,230"/><line class="g" x1="216" y1="210" x2="180" y2="226"/><text class="mitte t2" x="310" y="206">Ober- und Unterarm etwa 90 Grad</text><rect class="f" x="90" y="278" width="105" height="8"/><line class="l" x1="95" y1="278" x2="80" y2="190"/><line class="l" x1="140" y1="286" x2="140" y2="338"/><line class="l" x1="110" y1="340" x2="172" y2="340"/><rect class="f" x="200" y="246" width="400" height="8"/><line class="l" x1="588" y1="254" x2="588" y2="348"/><rect class="w" x="205" y="236" width="72" height="10"/><text class="mitte t2" x="241" y="228">Tastatur getrennt</text><rect class="f" x="424" y="145" width="14" height="90"/><line class="l" x1="431" y1="235" x2="431" y2="240"/><rect class="w" x="406" y="240" width="50" height="6"/><line class="d" x1="178" y1="120" x2="478" y2="120"/><text x="484" y="124">Augenhöhe</text><line class="a" x1="418" y1="145" x2="478" y2="145"/><text class="ta" x="484" y="151">Oberkante nicht</text><text class="ta" x="484" y="167">über Augenhöhe</text><line class="l" x1="174" y1="124" x2="418" y2="180" marker-end="url(#pfeil)"/><text class="mitte t2" x="300" y="172">Blicklinie nach unten</text><line class="l" x1="20" y1="348" x2="632" y2="348"/><line class="g" x1="596" y1="246" x2="628" y2="246"/><line class="g" x1="596" y1="348" x2="628" y2="348"/><line class="l" x1="612" y1="292" x2="612" y2="250" marker-end="url(#pfeil)"/><line class="l" x1="612" y1="304" x2="612" y2="344" marker-end="url(#pfeil)"/><text class="rechts t2" x="606" y="374">Tischhöhe rund 72 cm</text></svg><figcaption>Abb. B8-1: Aus dieser Seitenansicht lassen sich die Anforderungen an einen Bildschirmarbeitsplatz ablesen. Der Akzent markiert die Stelle, die am häufigsten falsch ist: die Bildschirmoberkante gehört in oder unter Augenhöhe.</figcaption></figure>
<figure class="abb" data-name="Abb. B8-2"><svg viewBox="0 0 640 287" role="img" aria-labelledby="b8-abb2-t"><title id="b8-abb2-t">Reihenfolge beim Einstellen eines Arbeitsplatzes</title><rect class="w" x="20" y="20" width="600" height="48"/><text x="36" y="49" class="ta">1</text><text x="58" y="41" class="tb">Stuhl</text><text x="606" y="41" class="t2 rechts">Füße flach, Ober- und Unterarm etwa im rechten</text><text x="606" y="57" class="t2 rechts">Winkel</text><line class="l" x1="320" y1="72" x2="320" y2="85" marker-end="url(#pfeil)"/><rect class="w" x="20" y="92" width="600" height="48"/><text x="36" y="121" class="ta">2</text><text x="58" y="113" class="tb">Tisch</text><text x="606" y="113" class="t2 rechts">fest rund 72 cm, verstellbar an den Stuhl</text><text x="606" y="129" class="t2 rechts">angepasst</text><line class="l" x1="320" y1="144" x2="320" y2="157" marker-end="url(#pfeil)"/><rect class="a" x="20" y="164" width="600" height="48"/><text x="36" y="193" class="ta">3</text><text x="58" y="185" class="tb">Bildschirm</text><text x="606" y="185" class="t2 rechts">Sehabstand 50 bis 70 cm, Oberkante nicht über</text><text x="606" y="201" class="t2 rechts">Augenhöhe</text><line class="l" x1="320" y1="216" x2="320" y2="229" marker-end="url(#pfeil)"/><rect class="w" x="20" y="236" width="600" height="31"/><text x="36" y="256.5" class="ta">4</text><text x="58" y="257" class="tb">Beleuchtung und Blendschutz</text><text x="606" y="257" class="t2 rechts">500 lx, parallel zum Fenster</text></svg><figcaption>Abb. B8-2: Von unten nach oben: jede Einstellung hängt von der vorherigen ab. Die Blicklinie soll leicht nach unten gehen.</figcaption></figure>
<figure class="abb" data-name="Abb. B8-3"><svg viewBox="0 0 640 308" role="img" aria-labelledby="b8-abb3-t"><title id="b8-abb3-t">Vier Interaktionsprinzipien für die Software</title><rect class="w" x="20" y="20" width="600" height="58"/><text x="34" y="45" class="ta">1</text><text x="54" y="45" class="tb">Aufgabenangemessenheit</text><text x="54" y="66" class="t2">die Maske fragt nur ab, was die Aufgabe braucht</text><rect class="w" x="20" y="90" width="600" height="58"/><text x="34" y="115" class="ta">2</text><text x="54" y="115" class="tb">Selbstbeschreibungsfähigkeit</text><text x="54" y="136" class="t2">der Nutzer erkennt, wo er ist und was als Nächstes passiert</text><rect class="w" x="20" y="160" width="600" height="58"/><text x="34" y="185" class="ta">3</text><text x="54" y="185" class="tb">Erwartungskonformität</text><text x="54" y="206" class="t2">gleiche Bedienelemente wirken überall gleich</text><rect class="w" x="20" y="230" width="600" height="58"/><text x="34" y="255" class="ta">4</text><text x="54" y="255" class="tb">Fehlertoleranz</text><text x="54" y="276" class="t2">eine falsche Eingabe wird erklärt und korrigiert, ohne den Vorgang zu verlieren</text></svg><figcaption>Abb. B8-3: Ein ergonomischer Tisch nützt wenig, wenn das Programm zu unnötigen Schritten zwingt.</figcaption></figure>
<figure class="abb" data-name="Abb. B8-4"><svg viewBox="0 0 640 300" role="img" aria-labelledby="b8-abb4-t"><title id="b8-abb4-t">Die vier WCAG-Prinzipien mit je einer Maßnahme</title><rect class="w" x="16" y="24" width="294" height="110"/><text class="tb" x="32" y="52">1 Wahrnehmbar</text><text x="32" y="76">Inhalte müssen sichtbar oder</text><text x="32" y="94">hörbar aufnehmbar sein.</text><text class="ta" x="32" y="120">Maßnahme: Kontrast 4,5:1</text><rect class="w" x="330" y="24" width="294" height="110"/><text class="tb" x="346" y="52">2 Bedienbar</text><text x="346" y="76">Alle Funktionen müssen sich</text><text x="346" y="94">ohne Maus bedienen lassen.</text><text x="346" y="120">Maßnahme: Tastaturbedienung</text><rect class="w" x="16" y="160" width="294" height="110"/><text class="tb" x="32" y="188">3 Verständlich</text><text x="32" y="212">Text und Bedienung müssen</text><text x="32" y="230">vorhersehbar bleiben.</text><text x="32" y="256">Maßnahme: klare Fehlertexte</text><rect class="w" x="330" y="160" width="294" height="110"/><text class="tb" x="346" y="188">4 Robust</text><text x="346" y="212">Hilfsmittel müssen den Inhalt</text><text x="346" y="230">zuverlässig auswerten können.</text><text x="346" y="256">Maßnahme: standardkonformer Code</text></svg><figcaption>Abb. B8-4: Vier Prinzipien, vier Maßnahmen. Wer sich je Prinzip eine Maßnahme merkt, kann die Aufzählung in der Prüfung mit Beispielen füllen.</figcaption></figure>
<figure class="abb" data-name="Abb. B8-5"><svg viewBox="0 0 640 320" role="img" aria-labelledby="b8-abb5-t"><title id="b8-abb5-t">Lebenszyklus eines IT-Geräts als Kreislauf</title><rect class="w" x="20" y="26" width="250" height="86"/><text class="tb" x="36" y="56">Beschaffung</text><text class="t2" x="36" y="80">Bedarf, Effizienzklasse,</text><text class="t2" x="36" y="98">Reparierbarkeit prüfen</text><rect class="w" x="370" y="26" width="250" height="86"/><text class="tb" x="386" y="56">Nutzung</text><text class="t2" x="386" y="80">Energiesparoptionen,</text><text class="t2" x="386" y="98">Wartung, Updates</text><rect class="a" x="370" y="200" width="250" height="86"/><text class="ta" x="386" y="230">Nutzungsdauer verlängern</text><text x="386" y="254">Reparatur, Aufrüstung,</text><text x="386" y="274">Weitergabe, Refurbished</text><rect class="w" x="20" y="200" width="250" height="86"/><text class="tb" x="36" y="230">Rücknahme nach ElektroG</text><text class="t2" x="36" y="254">Getrennte Erfassung,</text><text class="t2" x="36" y="274">Daten vorher löschen</text><line class="l" x1="276" y1="69" x2="364" y2="69" marker-end="url(#pfeil)"/><text class="mitte t2" x="320" y="58">in Betrieb</text><line class="l" x1="495" y1="118" x2="495" y2="194" marker-end="url(#pfeil)"/><text class="t2" x="505" y="160">wenn möglich</text><line class="l" x1="364" y1="243" x2="276" y2="243" marker-end="url(#pfeil)"/><text class="mitte t2" x="320" y="232">am Lebensende</text><line class="l" x1="145" y1="194" x2="145" y2="118" marker-end="url(#pfeil)"/><text class="t2" x="156" y="160">Sekundärrohstoffe</text></svg><figcaption>Abb. B8-5: Der Kreis erklärt, warum ökologische Argumente in zwei Richtungen zeigen. Die Verlängerung der Nutzungsdauer spart den gesamten Aufwand einer Neuherstellung.</figcaption></figure>
<figure class="abb" data-name="Abb. B8-6"><svg viewBox="0 0 640 151" role="img" aria-labelledby="b8-abb6-t"><title id="b8-abb6-t">Drei Abschnitte, in denen Nachhaltigkeit entschieden wird</title><rect class="w" x="20" y="22" width="177.3" height="109"/><text x="108.7" y="46" class="tb mitte">Beschaffung</text><text x="108.7" y="69" class="t2 mitte">Effizienzklasse,</text><text x="108.7" y="84" class="t2 mitte">Leistungsaufnahme,</text><text x="108.7" y="99" class="t2 mitte">Reparierbarkeit,</text><text x="108.7" y="114" class="t2 mitte">Ersatzteile</text><line class="l" x1="202.3" y1="76.5" x2="225.3" y2="76.5" marker-end="url(#pfeil)"/><rect class="w" x="231.3" y="22" width="177.3" height="109"/><text x="320" y="46" class="tb mitte">Betrieb</text><text x="320" y="69" class="t2 mitte">Energiesparoptionen,</text><text x="320" y="84" class="t2 mitte">schaltbare</text><text x="320" y="99" class="t2 mitte">Steckdosenleisten, Thin</text><text x="320" y="114" class="t2 mitte">Clients</text><line class="l" x1="413.7" y1="76.5" x2="436.7" y2="76.5" marker-end="url(#pfeil)"/><rect class="w" x="442.7" y="22" width="177.3" height="109"/><text x="531.3" y="46" class="tb mitte">Lebensende</text><text x="531.3" y="69" class="t2 mitte">getrennte Erfassung,</text><text x="531.3" y="84" class="t2 mitte">Rücknahme, fachgerechte</text><text x="531.3" y="99" class="t2 mitte">Verwertung</text></svg><figcaption>Abb. B8-6: Am Lebensende greift das ElektroG. Die zugehörige Stromrechnung bleibt in A5.</figcaption></figure>
<figure class="abb" data-name="Abb. B9-1"><svg viewBox="0 0 640 168" role="img" aria-labelledby="b9-abb1-t"><title id="b9-abb1-t">Vier Merkmale, die ein Vorhaben zum Projekt machen</title><rect class="w" x="20" y="20" width="292" height="58"/><text x="34" y="45" class="ta">1</text><text x="54" y="45" class="tb">Einmaligkeit</text><text x="54" y="66" class="t2">der Bedingungen insgesamt</text><rect class="w" x="328" y="20" width="292" height="58"/><text x="342" y="45" class="ta">2</text><text x="362" y="45" class="tb">Zielvorgabe</text><text x="362" y="66" class="t2">ein benanntes Ergebnis</text><rect class="w" x="20" y="90" width="292" height="58"/><text x="34" y="115" class="ta">3</text><text x="54" y="115" class="tb">Begrenzung</text><text x="54" y="136" class="t2">zeitlich, finanziell, personell</text><rect class="w" x="328" y="90" width="292" height="58"/><text x="342" y="115" class="ta">4</text><text x="362" y="115" class="tb">Eigene Organisation</text><text x="362" y="136" class="t2">für dieses Vorhaben gebildet</text></svg><figcaption>Abb. B9-1: Vier Merkmale, die ein Vorhaben zum Projekt machen. Fehlt eines, ist es Tagesgeschäft, und niemand braucht Netzplan oder Lastenheft dafür.</figcaption></figure>
<figure class="abb" data-name="Abb. B9-2">
    <svg viewBox="0 0 640 300" role="img" aria-labelledby="b9-abb2-t">
      <title id="b9-abb2-t">Lastenheft und Pflichtenheft als zwei Spalten: wer, was, wann</title>
      <text x="160" y="26" class="mitte tb">Lastenheft</text>
      <text x="480" y="26" class="mitte tb">Pflichtenheft</text>
      <rect class="w" x="20" y="40" width="280" height="196"/>
      <rect class="w" x="340" y="40" width="280" height="196"/>
      <text x="36" y="64" class="t2">Wer schreibt es</text>
      <text x="36" y="84">Auftraggeber, der Kunde</text>
      <text x="36" y="114" class="t2">Was steht drin</text>
      <text x="36" y="134">Anforderungen: was und wofür</text>
      <text x="36" y="152">Ziel, Ist-Zustand, Rahmen, Termin</text>
      <text x="36" y="182" class="t2">Wann entsteht es</text>
      <text x="36" y="202">vor Anfrage und Angebot</text>
      <text x="36" y="220" class="t2">Grundlage der Kalkulation</text>
      <text x="356" y="64" class="t2">Wer schreibt es</text>
      <text x="356" y="84">Auftragnehmer, das Systemhaus</text>
      <text x="356" y="114" class="t2">Was steht drin</text>
      <text x="356" y="134">Umsetzung: wie und womit</text>
      <text x="356" y="152">Lösungsweg, Technik, Abnahmekriterien</text>
      <text x="356" y="182" class="t2">Wann entsteht es</text>
      <text x="356" y="202">als Antwort, vor dem Vertrag</text>
      <text x="356" y="220" class="t2">verpflichtet den Anbieter</text>
      <line class="a" x1="300" y1="138" x2="334" y2="138" marker-end="url(#pfeil-a)"/>
      <text x="320" y="268" class="mitte ta">Jede Anforderung links bekommt rechts eine Lösung</text>
      <text x="320" y="290" class="mitte t2">Reihenfolge: Bedarf, Lastenheft, Pflichtenheft, Angebot, Vertrag, Abnahme</text>
    </svg>
    <figcaption>Abb. B9-2: Links schreibt der Kunde, rechts antwortet das Systemhaus. Der Akzentpfeil ist die Prüfungsfrage: Das Pflichtenheft entsteht als Antwort auf das Lastenheft, nie umgekehrt.</figcaption>
  </figure>
<figure class="abb" data-name="Abb. B9-3"><svg viewBox="0 0 640 283" role="img" aria-labelledby="b9-abb3-t"><title id="b9-abb3-t">Die fünf SMART-Kriterien in der Reihenfolge der Arbeit</title><rect class="w" x="20" y="20" width="292" height="73"/><text x="34" y="45" class="ta">1</text><text x="54" y="45" class="tb">Spezifisch</text><text x="54" y="66" class="t2">das Ergebnis benennen</text><rect class="w" x="328" y="20" width="292" height="73"/><text x="342" y="45" class="ta">2</text><text x="362" y="45" class="tb">Messbar</text><text x="362" y="66" class="t2">die Messgröße festlegen</text><rect class="w" x="20" y="105" width="292" height="73"/><text x="34" y="130" class="ta">3</text><text x="54" y="130" class="tb">Erreichbar</text><text x="54" y="151" class="t2">Team und Budget geben es her</text><rect class="w" x="328" y="105" width="292" height="73"/><text x="342" y="130" class="ta">4</text><text x="362" y="130" class="tb">Realistisch</text><text x="362" y="151" class="t2">unter den gegebenen Bedingungen</text><text x="362" y="166" class="t2">machbar</text><rect class="a" x="20" y="190" width="292" height="73"/><text x="34" y="215" class="ta">5</text><text x="54" y="215" class="tb">Terminiert</text><text x="54" y="236" class="t2">einen Termin setzen</text></svg><figcaption>Abb. B9-3: Beispiel: „Bis zum 31. März sind alle laufenden Mandantenakten gescannt und über die Volltextsuche in unter drei Sekunden auffindbar.“</figcaption></figure>

<figure class="abb" data-name="Abb. B10-1"><svg viewBox="0 0 640 253" role="img" aria-labelledby="b10-abb1-t"><title id="b10-abb1-t">Vier Schritte durch ein Kundengespräch</title><rect class="w" x="20" y="20" width="600" height="31"/><text x="36" y="40.5" class="ta">1</text><text x="58" y="41" class="tb">Offen fragen</text><text x="606" y="41" class="t2 rechts">was passiert, seit wann, wer ist betroffen</text><line class="l" x1="320" y1="55" x2="320" y2="68" marker-end="url(#pfeil)"/><rect class="w" x="20" y="75" width="600" height="48"/><text x="36" y="104" class="ta">2</text><text x="58" y="96" class="tb">Aktiv zuhören</text><text x="606" y="96" class="t2 rechts">in eigenen Worten zurückgeben, Gefühl benennen,</text><text x="606" y="112" class="t2 rechts">nachfragen</text><line class="l" x1="320" y1="127" x2="320" y2="140" marker-end="url(#pfeil)"/><rect class="w" x="20" y="147" width="600" height="31"/><text x="36" y="167.5" class="ta">3</text><text x="58" y="168" class="tb">Geschlossen absichern</text><text x="606" y="168" class="t2 rechts">das Verstandene bestätigen lassen</text><line class="l" x1="320" y1="182" x2="320" y2="195" marker-end="url(#pfeil)"/><rect class="a" x="20" y="202" width="600" height="31"/><text x="36" y="222.5" class="ta">4</text><text x="58" y="223" class="tb">Zusammenfassen</text><text x="606" y="223" class="t2 rechts">sagen, was du tun wirst</text></svg><figcaption>Abb. B10-1: Die Zusammenfassung ist das Feedback an den Kunden; sie deckt Missverständnisse auf, bevor du handelst.</figcaption></figure>
<figure class="abb" data-name="Abb. B10-2"><svg viewBox="0 0 640 340" role="img" aria-labelledby="b10-abb2-t"><title id="b10-abb2-t">Vier-Seiten-Modell am Satz „Der Drucker geht schon wieder nicht"</title><text x="320" y="46" class="mitte tb">Sachseite</text><text x="320" y="68" class="mitte">Ein Drucker funktioniert nicht, zum wiederholten Mal.</text><line class="l" x1="320" y1="118" x2="320" y2="82" marker-end="url(#pfeil)"/><rect class="w" x="215" y="118" width="210" height="130"/><text x="320" y="146" class="mitte t2">Nachricht der Kundin</text><text x="320" y="178" class="mitte">„Der Drucker geht</text><text x="320" y="200" class="mitte">schon wieder nicht."</text><line class="a" x1="320" y1="248" x2="320" y2="284" marker-end="url(#pfeil-a)"/><text x="320" y="306" class="mitte ta">Appellseite</text><text x="320" y="328" class="mitte">Kommt her und behebt das dauerhaft.</text><line class="l" x1="215" y1="183" x2="180" y2="183" marker-end="url(#pfeil)"/><text x="10" y="150" class="tb">Selbstoffenbarung</text><text x="10" y="176">Ich bin genervt und</text><text x="10" y="196">komme mit meiner</text><text x="10" y="216">Arbeit nicht weiter.</text><line class="l" x1="425" y1="183" x2="460" y2="183" marker-end="url(#pfeil)"/><text x="468" y="150" class="tb">Beziehungsseite</text><text x="468" y="176">Ihr habt das nicht</text><text x="468" y="196">im Griff, ich muss</text><text x="468" y="216">euch hinterherlaufen.</text></svg><figcaption>Abb. B10-2: Ein Satz, vier Lesarten. Der Akzent liegt auf dem Appell, denn aus ihm leitet der Techniker seine nächste Handlung ab.</figcaption></figure>
<figure class="abb" data-name="Abb. B10-3"><svg viewBox="0 0 640 228" role="img" aria-labelledby="b10-abb3-t"><title id="b10-abb3-t">Drei Phasen der Veränderung nach Lewin mit je einer Maßnahme</title><rect class="f" x="10" y="30" width="180" height="60"/><rect class="a" x="10" y="30" width="180" height="60"/><text x="100" y="56" class="mitte tb">1 Auftauen</text><text x="100" y="78" class="mitte t2">unfreezing</text><line class="l" x1="192" y1="60" x2="226" y2="60" marker-end="url(#pfeil)"/><rect class="w" x="230" y="30" width="180" height="60"/><text x="320" y="56" class="mitte tb">2 Bewegen</text><text x="320" y="78" class="mitte t2">moving</text><line class="l" x1="412" y1="60" x2="446" y2="60" marker-end="url(#pfeil)"/><rect class="w" x="450" y="30" width="180" height="60"/><text x="540" y="56" class="mitte tb">3 Einfrieren</text><text x="540" y="78" class="mitte t2">refreezing</text><text x="10" y="118">Gewohnheit lösen,</text><text x="10" y="136">Sicherheit geben</text><text x="230" y="118">Neues ausprobieren,</text><text x="230" y="136">Fehler sind erlaubt</text><text x="450" y="118">Neues wird Routine,</text><text x="450" y="136">Rückfall verhindern</text><line class="g" x1="10" y1="152" x2="630" y2="152"/><text x="10" y="170" class="t2">Maßnahme</text><text x="10" y="190">Informieren: warum, was,</text><text x="10" y="208">was ändert sich für wen</text><text x="230" y="170" class="t2">Maßnahme</text><text x="230" y="190">Schulen, Pilotphase,</text><text x="230" y="208">Key-User als Vorbilder</text><text x="450" y="170" class="t2">Maßnahme</text><text x="450" y="190">Erfolge sichtbar machen,</text><text x="450" y="208">Feedback, Dokumentation</text></svg><figcaption>Abb. B10-3: Der Akzent liegt auf dem Auftauen. Wer diese Phase überspringt und sofort schult, arbeitet gegen geschlossene Türen.</figcaption></figure>
<figure class="abb" data-name="Abb. B10-4"><svg viewBox="0 0 640 232" role="img" aria-labelledby="b10-abb4-t"><title id="b10-abb4-t">Vier Prüffragen je Prozessschritt</title><rect class="w" x="20" y="20" width="600" height="39"/><text x="34" y="45" class="ta">1</text><text x="54" y="45" class="tb">Kehrt der Schritt wieder?</text><rect class="w" x="20" y="71" width="600" height="39"/><text x="34" y="96" class="ta">2</text><text x="54" y="96" class="tb">Folgt er Regeln oder Mustern?</text><rect class="w" x="20" y="122" width="600" height="39"/><text x="34" y="147" class="ta">3</text><text x="54" y="147" class="tb">Liegen viele Daten digital vor?</text><rect class="w" x="20" y="173" width="600" height="39"/><text x="34" y="198" class="ta">4</text><text x="54" y="198" class="tb">Prüft danach ein Mensch das Ergebnis?</text></svg><figcaption>Abb. B10-4: Wo du viermal Ja sagst, liegt eine Einsatzstelle für KI.</figcaption></figure>
<figure class="abb" data-name="Abb. B10-5"><svg viewBox="0 0 640 250" role="img" aria-labelledby="b10-abb5-t">

<pre id="out"></pre>
<script>
const out = [];
const rects = (a, b) => !(a.x + a.width <= b.x || b.x + b.width <= a.x || a.y + a.height <= b.y || b.y + b.height <= a.y);
document.querySelectorAll('figure.abb').forEach(fig => {
  const name = fig.dataset.name, svg = fig.querySelector('svg');
  const vb = svg.viewBox.baseVal; const texts = [...svg.querySelectorAll('text')];
  const boxes = texts.map(t => { const b = t.getBBox(); return {t, b, s: (t.textContent || '').trim()}; });
  boxes.forEach(({b, s}) => {
    if (b.width === 0) return;
    if (b.x < vb.x - 1 || b.y < vb.y - 1 || b.x + b.width > vb.x + vb.width + 1 || b.y + b.height > vb.y + vb.height + 1)
      out.push(name + ' | RAND | "' + s + '" ragt aus dem Bild (x ' + Math.round(b.x) + '..' + Math.round(b.x + b.width) + ', y ' + Math.round(b.y) + '..' + Math.round(b.y + b.height) + ', Bild ' + vb.width + 'x' + vb.height + ')');
  });
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const A = boxes[i], B = boxes[j]; if (!A.s || !B.s) continue;
    if (rects(A.b, B.b)) {
      const ix = Math.min(A.b.x + A.b.width, B.b.x + B.b.width) - Math.max(A.b.x, B.b.x);
      const iy = Math.min(A.b.y + A.b.height, B.b.y + B.b.height) - Math.max(A.b.y, B.b.y);
      if (ix > 2 && iy > 2) out.push(name + ' | TEXT-TEXT | "' + A.s + '" ueberlappt "' + B.s + '" (' + Math.round(ix) + 'x' + Math.round(iy) + ')');
    }
  }
  // Text ueber Boxen, in denen er nicht steht: Text ragt ueber den Rand eines rect, in dem sein Mittelpunkt liegt
  const rs = [...svg.querySelectorAll('rect')].map(r => ({x: +r.getAttribute('x') || 0, y: +r.getAttribute('y') || 0, w: +r.getAttribute('width') || 0, h: +r.getAttribute('height') || 0}));
  boxes.forEach(({b, s}) => {
    if (!s) return; const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    rs.forEach(r => { if (cx > r.x && cx < r.x + r.w && cy > r.y && cy < r.y + r.h && (b.x < r.x - 1 || b.x + b.width > r.x + r.w + 1))
      out.push(name + ' | BOX | "' + s + '" breiter als seine Box (Text ' + Math.round(b.width) + ', Box ' + r.w + ')'); });
  });
});
document.title = 'FERTIG';
document.getElementById('out').textContent = out.join('\n') || 'Keine Befunde.';
</script></body></html>
