</main>
<script>
(function(){

  /* Druck: alle Lösungen aufklappen, danach Zustand wiederherstellen */
  try{
    var geoeffnet=[];
    window.addEventListener('beforeprint',function(){
      geoeffnet=[];
      Array.prototype.forEach.call(document.querySelectorAll('details'),function(d){
        if(!d.open){ d.open=true; geoeffnet.push(d); }
      });
    });
    window.addEventListener('afterprint',function(){
      geoeffnet.forEach(function(d){ d.open=false; });
      geoeffnet=[];
    });
  }catch(e){}

  /* Aktuelles Kapitel in der Navigation markieren */
  try{
    if('IntersectionObserver' in window){
      var links={};
      Array.prototype.forEach.call(document.querySelectorAll('nav.inhalt a[href^="#"]'),function(a){
        links[a.getAttribute('href').slice(1)]=a;
      });
      var io=new IntersectionObserver(function(eintraege){
        eintraege.forEach(function(e){
          if(e.isIntersecting){
            Array.prototype.forEach.call(document.querySelectorAll('nav.inhalt a.aktuell'),function(a){ a.classList.remove('aktuell'); });
            var a=links[e.target.id];
            if(a){ a.classList.add('aktuell'); }
          }
        });
      },{rootMargin:'-8% 0px -82% 0px'});
      Array.prototype.forEach.call(document.querySelectorAll('main section[id]'),function(s){
        if(links[s.id]){ io.observe(s); }
      });
    }
  }catch(e){}

  /* Teil 2 als Pruefungsansicht. Beides braucht JavaScript;
     ohne JavaScript bleibt Teil 2 die Tabelle wie bisher. */

  /* Rueckweg: wer in einer Pruefungstabelle einen Link anklickt, bekommt unten eine Leiste,
     die zu genau dieser Aufgabenzeile zurueckfuehrt. Merkzettel im sessionStorage. */
  try{
    var SCHL='ap1-rueckweg';
    var merk=function(w){ try{ if(w===null){ sessionStorage.removeItem(SCHL); } else { sessionStorage.setItem(SCHL,w); } }catch(e){} };
    var leiste=function(){
      var alt=document.getElementById('rueckweg');
      if(alt){ alt.parentNode.removeChild(alt); }
      var w=null; try{ w=sessionStorage.getItem(SCHL); }catch(e){}
      if(!w){ return; }
      var teil=w.split('|');
      if(teil.length!==2){ return; }
      var kasten=document.createElement('div'); kasten.id='rueckweg';
      var a=document.createElement('a');
      a.href='#'+teil[0];
      a.textContent='\u2190 zur\u00fcck zu '+teil[1];
      a.addEventListener('click',function(){ merk(null); setTimeout(leiste,0); });
      kasten.appendChild(a); document.body.appendChild(kasten);
    };
    document.addEventListener('click',function(e){
      var z=e.target;
      if(!z||!z.closest){ return; }
      if(!z.closest('a[href^="#"]')){ return; }
      var zeile=z.closest('tr[data-weg]');
      if(!zeile||!zeile.id){ return; }
      merk(zeile.id+'|'+zeile.getAttribute('data-weg'));
      leiste();
    });
    leiste();
  }catch(e){}

  /* Strichliste je Pruefung: ein Haekchen pro Aufgabe, der Stand in der Tabellenueberschrift.
     Die Spalte entsteht erst hier, damit ohne JavaScript keine toten Kaestchen dastehen. */
  try{
    Array.prototype.forEach.call(document.querySelectorAll('#matrix table'),function(tab){
      var zeilen=tab.querySelectorAll('tr[data-weg]');
      if(!zeilen.length||!tab.caption||!tab.rows.length){ return; }
      var kopf=tab.rows[0], th=document.createElement('th');
      th.textContent='Erledigt'; kopf.insertBefore(th,kopf.cells[0]);
      var summe=tab.querySelector('tr.summe');
      if(summe){ summe.insertBefore(document.createElement('td'),summe.cells[0]); }
      var stand=document.createElement('span'); stand.className='stand';
      tab.caption.appendChild(stand);
      var haken=[];
      var zaehlen=function(){
        var n=0,p=0,pg=0;
        haken.forEach(function(h){ pg+=h.p; if(h.el.checked){ n++; p+=h.p; } });
        stand.textContent=' · Erledigt: '+n+' von '+haken.length+' Aufgaben, '+p+' von '+pg+' Punkten.';
      };
      Array.prototype.forEach.call(zeilen,function(zeile){
        var nr=zeile.cells[0].textContent;
        var pz=zeile.querySelector('td.z');
        var punkte=pz?(Number(pz.textContent)||0):0;
        var el=document.createElement('input');
        el.type='checkbox';
        el.setAttribute('aria-label','Aufgabe '+nr+' erledigt');
        var schl='ap1-erledigt-'+zeile.id;
        try{ el.checked=localStorage.getItem(schl)==='1'; }catch(e){}
        el.addEventListener('change',function(){
          try{ if(el.checked){ localStorage.setItem(schl,'1'); } else { localStorage.removeItem(schl); } }catch(e){}
          zaehlen();
        });
        var td=document.createElement('td'); td.appendChild(el);
        zeile.insertBefore(td,zeile.cells[0]);
        haken.push({el:el,p:punkte});
      });
      zaehlen();
    });
  }catch(e){}
})();
</script>
</body>
</html>
